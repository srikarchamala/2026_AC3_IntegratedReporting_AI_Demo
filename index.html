<script id="data" type="application/json">{"chat": [{"run": 1, "html": "<h1>Integrated Hematopathology Diagnostic Report<\/h1>\n<h2>Patient Identifiers<\/h2>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Patient<\/td>\n<td>DOE, JONATHAN R.<\/td>\n<\/tr>\n<tr>\n<td>MRN<\/td>\n<td>MRN-4471902<\/td>\n<\/tr>\n<tr>\n<td>DOB / Age / Sex<\/td>\n<td>1967-09-14 / 58 y / Male<\/td>\n<\/tr>\n<tr>\n<td>Ordering provider<\/td>\n<td>Anjali R. Patel, MD (Hematology/Oncology)<\/td>\n<\/tr>\n<tr>\n<td>Location<\/td>\n<td>Inpatient, 6 West Hematology<\/td>\n<\/tr>\n<tr>\n<td>Specimen<\/td>\n<td>Bone marrow, left posterior iliac crest (aspirate and core biopsy)<\/td>\n<\/tr>\n<tr>\n<td>Collected<\/td>\n<td>2026-04-22<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Component accessions<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Study<\/th>\n<th>Accession<\/th>\n<th>Reported<\/th>\n<th>Signed by<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Morphology<\/td>\n<td>S26-BM-01187<\/td>\n<td>2026-04-24<\/td>\n<td>Marcus T. Whitfield, MD<\/td>\n<\/tr>\n<tr>\n<td>Flow cytometry<\/td>\n<td>FC-26-003942<\/td>\n<td>2026-04-23<\/td>\n<td>Priya N. Raghavan, MD<\/td>\n<\/tr>\n<tr>\n<td>Cytogenetics / FISH<\/td>\n<td>CG-26-00871<\/td>\n<td>2026-04-29<\/td>\n<td>Helena V. Brandt, PhD, FACMG<\/td>\n<\/tr>\n<tr>\n<td>Molecular NGS (Meridian Molecular Diagnostics)<\/td>\n<td>MMD-26-NGS-22150 (client S26-BM-01187)<\/td>\n<td>2026-05-04<\/td>\n<td>Daniel U. Okafor, MD, PhD; Lucia M. Fernandez, PhD<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Clinical History<\/h2>\n<p>58-year-old man with three weeks of progressive fatigue, dyspnea on exertion, gingival bleeding, and lower-extremity ecchymoses. Admission CBC: WBC 38.4 x10^9/L, Hgb 7.9 g/dL, platelets 31 x10^9/L. Peripheral smear showed <strong>41% circulating blasts<\/strong>, some with folded nuclei and abundant cytoplasm. No prior hematologic disease, chemotherapy, or radiation.<\/p>\n<hr />\n<h2>Per-Modality Summaries<\/h2>\n<h3>1. Morphology and Cytochemistry (S26-BM-01187)<\/h3>\n<ul>\n<li><strong>Aspirate (500-cell differential):<\/strong> blasts 18%, promonocytes 4%, mature monocytes 6%, M:E about 4.4:1.<\/li>\n<li>Medium-to-large blasts, some with folded or indented nuclei, grayish cytoplasm, and fine azurophilic granules. <strong>No Auer rods.<\/strong><\/li>\n<li><strong>Core biopsy:<\/strong> markedly hypercellular (90-95%), with sheets of immature mononuclear cells. Megakaryocytes markedly reduced. No significant fibrosis (MF-1). No ring sideroblasts.<\/li>\n<li><strong>Cytochemistry:<\/strong> MPO positive in about 5-10% of blasts. NSE positive in a subset, with partial fluoride inhibition, which suggests a monocytic component.<\/li>\n<li><strong>Diagnosis:<\/strong> acute myeloid leukemia with probable monocytic differentiation. The pathologist notes that the 18% aspirate count likely underestimates disease burden because of hemodilution and the difficulty of separating promonocytes from blasts.<\/li>\n<\/ul>\n<h3>2. Flow Cytometry (FC-26-003942)<\/h3>\n<ul>\n<li>Viability 94%; 8-color panel.<\/li>\n<li><strong>Myeloid blasts: 22% of TNC.<\/strong> Phenotype: CD34+ (about 60% of blasts), CD117+, HLA-DR bright, CD13+, CD33 bright, CD38+, CD64+, dim cytoplasmic MPO, dim CD4, partial CD11b. Aberrant <strong>CD56 (partial)<\/strong> and <strong>CD7 (subset)<\/strong>. CD14, CD2, CD19, and cyCD3 negative.<\/li>\n<li><strong>Monocytic compartment: about 30% of TNC<\/strong> (19% maturing monocytes plus 11% promonocytes/immature monocytic cells). Phenotype: CD64 bright and uniform, CD14+ on the maturing fraction, CD11b+, CD11c+, CD36+, HLA-DR+, dim CD4, CD34 negative.<\/li>\n<li>Lymphocytes are polytypic with no aberrancy.<\/li>\n<li><strong>Interpretation:<\/strong> diagnostic of AML with monocytic differentiation. This confirms the lineage that morphology only favored.<\/li>\n<\/ul>\n<h3>3. Cytogenetics and FISH (CG-26-00871)<\/h3>\n<ul>\n<li><strong>Karyotype: 46,XY[20].<\/strong> Normal male karyotype at 400-425 band resolution.<\/li>\n<li><strong>AML FISH panel (200 nuclei per probe): all negative.<\/strong> Probes covered RUNX1-RUNX1T1, CBFB, PML-RARA, KMT2A, MECOM, 5q31 (EGR1), 7q (D7S486), and TP53 (17p13.1). All results were within normal cutoffs.<\/li>\n<li><strong>Interpretation:<\/strong> cytogenetically normal AML. Molecular testing is needed for classification.<\/li>\n<\/ul>\n<h3>4. Molecular NGS, 54-Gene Myeloid Panel (MMD-26-NGS-22150)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Gene<\/th>\n<th>Variant<\/th>\n<th>VAF<\/th>\n<th>Tier<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>NPM1<\/strong><\/td>\n<td>c.860_863dup, p.(Trp288CysfsTer12); type A 4-bp TCTG duplication<\/td>\n<td>39%<\/td>\n<td>I<\/td>\n<\/tr>\n<tr>\n<td><strong>FLT3<\/strong><\/td>\n<td>ITD, exon 14 (~36 bp); ITD/WT allelic ratio 0.62<\/td>\n<td>31%<\/td>\n<td>I<\/td>\n<\/tr>\n<tr>\n<td><strong>DNMT3A<\/strong><\/td>\n<td>c.2645G&gt;A, p.(Arg882His) (R882 hotspot)<\/td>\n<td>44%<\/td>\n<td>II<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>No reportable variants were found in CEBPA, RUNX1, TP53, ASXL1, IDH1/2, NRAS/KRAS, KIT, TET2, splicing factor genes, WT1, or the other listed genes.<\/li>\n<li>Mean coverage was 1,150x, with analytical sensitivity of about 5% VAF.<\/li>\n<\/ul>\n<hr />\n<h2>Integrated Interpretation<\/h2>\n<p>The four studies agree with each other and point to one diagnosis:<\/p>\n<ol>\n<li><strong>Leukemia is established.<\/strong> The marrow is 90-95% cellular with sheets of immature cells, and there are 41% blasts in the peripheral blood. Flow cytometry found an abnormal myeloid blast population with an aberrant phenotype (CD56, CD7).<\/li>\n<li><strong>The lineage is myeloid with monocytic differentiation.<\/strong> Morphology and NSE cytochemistry suggested it. Flow cytometry confirmed it, showing an expanded, left-shifted monocytic compartment (about 30% of TNC) with bright CD64, CD11b, CD11c, CD36, and dim CD4.<\/li>\n<li><strong>No recurrent cytogenetic abnormality was found.<\/strong> The karyotype is normal and the FISH panel is negative, so no karyotype- or FISH-defined AML subtype applies.<\/li>\n<li><strong>The defining genetic lesion is NPM1 mutation.<\/strong> As the molecular report states, mutated NPM1 is a WHO- and ICC-recognized disease-defining abnormality. Because of this, <strong>the 20% blast threshold is not required.<\/strong> This settles the borderline aspirate blast count (18%). It is also worth noting that blast estimates in this case are all at or near threshold or above it: 18% manual aspirate, 22% by flow, and 41% in peripheral blood.<\/li>\n<\/ol>\n<p><strong>Notes on the discrepancies between reports (none change the diagnosis):<\/strong>\n- <strong>Blast percentage:<\/strong> 18% (manual aspirate), 22% (flow), and 41% (peripheral blood). The flow report says gating and manual counts are expected to differ, and that either value supports the diagnosis. The morphology report attributes the low aspirate count to hemodilution and to the difficulty of classifying promonocytes.\n- <strong>Monocytic burden:<\/strong> morphology counted about 10% monocytic cells (6% mature plus 4% promonocytes), while flow counted about 30%. This fits the morphologist's stated difficulty in identifying promonocytes on smears. Flow cytometry is the more objective measure of lineage here.\n- <strong>Allele frequencies:<\/strong> the DNMT3A VAF (44%) is higher than the NPM1 (39%) and FLT3-ITD (31%) VAFs. This fits the molecular report's comment that DNMT3A R882H is often a founder (clonal hematopoiesis) event, with NPM1 and FLT3-ITD arising later in the clone.<\/p>\n<hr />\n<h2 id=\"dx-1\">Final Diagnosis<\/h2>\n<blockquote>\n<p><strong>BONE MARROW, LEFT POSTERIOR ILIAC CREST (ASPIRATE AND CORE BIOPSY):<\/strong>\n<strong>ACUTE MYELOID LEUKEMIA WITH MUTATED NPM1<\/strong> (WHO / ICC), with monocytic differentiation.\n- Concurrent <strong>FLT3 internal tandem duplication<\/strong> (VAF 31%, allelic ratio 0.62)\n- Concurrent <strong><mark class=\"lane\">DNMT3A p.R882H<\/mark><\/strong> (VAF 44%)\n- Normal male karyotype, 46,XY[20]; AML FISH panel negative\n- Hypercellular marrow (90-95%); blasts 18% (aspirate), 22% (flow), 41% (peripheral blood)\n- Aberrant blast immunophenotype: CD56 (partial), CD7 (subset)<\/p>\n<\/blockquote>\n<hr />\n<h2>Prognostic and Therapeutic Notes<\/h2>\n<p>These notes use only what the source reports state:<\/p>\n<ul>\n<li><strong>NPM1 mutation:<\/strong> this is the disease-defining lesion, and it occurs here with a normal karyotype.<\/li>\n<li><strong>FLT3-ITD:<\/strong> the molecular report calls it <strong>prognostically adverse<\/strong> and a <strong>target for FLT3 inhibitor therapy<\/strong>. The allelic ratio (0.62) is reported to support treatment decisions.<\/li>\n<li><strong>DNMT3A R882H:<\/strong> commonly co-mutated with NPM1 and FLT3-ITD and often a clonal hematopoiesis founder event. It does not change the WHO/ICC category and is reported for completeness and <em>potential<\/em> prognostic relevance.<\/li>\n<li><strong>Adverse cytogenetic lesions were not found:<\/strong> FISH was negative for KMT2A, MECOM, -5/5q-, -7/7q-, and TP53 deletion, and NGS found no TP53, RUNX1, or ASXL1 variants.<\/li>\n<li><strong>Measurable residual disease (MRD):<\/strong> the flow report says the aberrant CD56/CD7 expression may be useful for MRD tracking.<\/li>\n<li><strong>Formal risk category:<\/strong> none of the four reports assigns a formal risk group (for example, an ELN category). The treating team should determine it using current guidelines.<\/li>\n<\/ul>\n<hr />\n<h2>Limitations<\/h2>\n<ul>\n<li>The aspirate blast count may be underestimated because of hemodilution.<\/li>\n<li>A normal karyotype does not exclude submicroscopic abnormalities.<\/li>\n<li>The NGS assay has about 5% VAF sensitivity and does not reliably detect large structural rearrangements or copy-number changes. A negative result does not exclude mutations below the detection limit.<\/li>\n<li>The flow and NGS assays are laboratory-developed tests; the NGS assay is not FDA-cleared.<\/li>\n<li>Minor documentation point: the morphology report's footer reads \"Page 1 of 1,\" but the report runs to two pages.<\/li>\n<\/ul>\n<p><em>This integrated summary is compiled from the four attached component reports and should be reviewed and signed by the responsible hematopathologist.<\/em><\/p>", "headings": ["Patient Identifiers", "Clinical History", "Per-Modality Summaries", "Integrated Interpretation", "Final Diagnosis", "Prognostic and Therapeutic Notes", "Limitations"], "checks": {"npm1_in_dx": true, "dnmt3a_out_of_dx": false, "blast_reconciled": true, "dnmt3a_in_prog": true, "flt3_in_dx": true}}, {"run": 2, "html": "<h1>Integrated Hematopathology Diagnostic Report<\/h1>\n<h2>1. Patient and Specimen Identifiers<\/h2>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Patient<\/td>\n<td>DOE, JONATHAN R.<\/td>\n<\/tr>\n<tr>\n<td>MRN<\/td>\n<td>MRN-4471902<\/td>\n<\/tr>\n<tr>\n<td>DOB / Age / Sex<\/td>\n<td>1967-09-14 / 58 y / Male<\/td>\n<\/tr>\n<tr>\n<td>Ordering provider<\/td>\n<td>Anjali R. Patel, MD (Hematology/Oncology)<\/td>\n<\/tr>\n<tr>\n<td>Location<\/td>\n<td>Inpatient, 6 West Hematology<\/td>\n<\/tr>\n<tr>\n<td>Specimen<\/td>\n<td>Bone marrow, left posterior iliac crest (aspirate and core biopsy)<\/td>\n<\/tr>\n<tr>\n<td>Collection date<\/td>\n<td>2026-04-22 (all studies)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Component accessions<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Study<\/th>\n<th>Accession<\/th>\n<th>Reported<\/th>\n<th>Signed by<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bone marrow morphology<\/td>\n<td>S26-BM-01187<\/td>\n<td>2026-04-24<\/td>\n<td>Marcus T. Whitfield, MD<\/td>\n<\/tr>\n<tr>\n<td>Flow cytometry<\/td>\n<td>FC-26-003942<\/td>\n<td>2026-04-23<\/td>\n<td>Priya N. Raghavan, MD<\/td>\n<\/tr>\n<tr>\n<td>Cytogenetics and FISH<\/td>\n<td>CG-26-00871<\/td>\n<td>2026-04-29<\/td>\n<td>Helena V. Brandt, PhD, FACMG<\/td>\n<\/tr>\n<tr>\n<td>Molecular NGS (Meridian Molecular Diagnostics)<\/td>\n<td>MMD-26-NGS-22150 (client S26-BM-01187)<\/td>\n<td>2026-05-04<\/td>\n<td>Daniel U. Okafor, MD, PhD; Lucia M. Fernandez, PhD<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Name, MRN, DOB and collection date match across all four reports.<\/p>\n<h2>2. Clinical History<\/h2>\n<p>58-year-old man with three weeks of progressive fatigue, dyspnea on exertion, gingival bleeding and lower-extremity ecchymoses. Admission CBC: WBC 38.4 x10^9/L, Hgb 7.9 g/dL, platelets 31 x10^9/L. The peripheral smear showed <strong>41% circulating blasts<\/strong>, some with folded nuclei and abundant cytoplasm. He has no prior hematologic history and no prior chemotherapy or radiation.<\/p>\n<h2>3. Summary by Study<\/h2>\n<h3>A. Morphology and cytochemistry (S26-BM-01187)<\/h3>\n<ul>\n<li><strong>Aspirate (500-cell differential):<\/strong> 18% blasts and 4% promonocytes (counted separately); 6% mature monocytes; M:E ratio about 4.4:1.<\/li>\n<li>Blasts are medium to large with fine chromatin and 1\u20133 nucleoli. A subset has folded or indented nuclei and grayish cytoplasm, which suggests monocytic features. <strong>No Auer rods<\/strong> were seen.<\/li>\n<li><strong>Core biopsy:<\/strong> 90\u201395% cellular, with sheets of immature mononuclear cells. Residual hematopoiesis is markedly decreased and megakaryocytes are markedly reduced. Reticulin is MF-1. There are no ring sideroblasts.<\/li>\n<li><strong>Cytochemistry:<\/strong> MPO stains about 5\u201310% of blasts. NSE is positive in a subset of cells with partial fluoride inhibition, which supports a monocytic component.<\/li>\n<li><strong>Diagnosis:<\/strong> hypercellular marrow with acute myeloid leukemia, probably with monocytic differentiation. The aspirate blast count is likely underestimated because of hemodilution and because promonocytes are hard to tell apart from blasts on smears.<\/li>\n<\/ul>\n<h3>B. Flow cytometry (FC-26-003942)<\/h3>\n<ul>\n<li>Viability was 94%.<\/li>\n<li><strong>Abnormal myeloid blasts: 22% of total nucleated cells.<\/strong> Phenotype: CD34+ (about 60%), CD117+, HLA-DR bright, CD13+, CD33 bright, CD38+, dim cytoplasmic MPO. Aberrant markers: CD56 (partial) and CD7 (subset). CD64+ and dim CD4. Negative for CD14, CD2, CD19 and cyCD3.<\/li>\n<li><strong>Expanded, left-shifted monocytic compartment, about 30% in total<\/strong> (19% maturing monocytes plus 11% promonocytes). Phenotype: bright uniform CD64, CD14 on the maturing fraction, CD11b, CD11c, CD36, HLA-DR, dim CD4, and partial CD56.<\/li>\n<li>Lymphocytes are polytypic with no aberrancy.<\/li>\n<li><strong>Interpretation:<\/strong> AML with monocytic differentiation. Flow cytometry confirms the monocytic lineage that morphology could only suggest. The aberrant CD56/CD7 pattern is a possible marker for measurable residual disease (MRD).<\/li>\n<\/ul>\n<h3>C. Cytogenetics and FISH (CG-26-00871)<\/h3>\n<ul>\n<li><strong>Karyotype:<\/strong> 46,XY[20]. This is a normal male karyotype; 20 metaphases were analyzed at 400\u2013425 band resolution.<\/li>\n<li><strong>AML FISH panel (200 nuclei per probe):<\/strong> negative for RUNX1-RUNX1T1, CBFB, PML-RARA, KMT2A, MECOM, \u22125/5q, \u22127/7q and TP53/17p deletion. All results were within normal cutoffs.<\/li>\n<li><strong>Interpretation:<\/strong> cytogenetically normal AML. Molecular testing is needed for classification.<\/li>\n<\/ul>\n<h3>D. Molecular NGS, 54-gene myeloid panel (MMD-26-NGS-22150)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Gene<\/th>\n<th>Variant<\/th>\n<th>VAF<\/th>\n<th>Tier<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>NPM1<\/strong><\/td>\n<td>c.860_863dup, p.(Trp288CysfsTer12), type A<\/td>\n<td>39%<\/td>\n<td>I<\/td>\n<\/tr>\n<tr>\n<td><strong>FLT3<\/strong><\/td>\n<td>Exon 14 ITD (~36 bp, in-frame); ITD/WT allelic ratio 0.62<\/td>\n<td>31%<\/td>\n<td>I<\/td>\n<\/tr>\n<tr>\n<td><strong>DNMT3A<\/strong><\/td>\n<td>c.2645G&gt;A, p.(Arg882His), R882 hotspot<\/td>\n<td>44%<\/td>\n<td>II<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>No reportable variants were found in CEBPA, RUNX1, TP53, ASXL1, IDH1/2, NRAS/KRAS, KIT, TET2, the splicing genes, WT1 or the other listed genes.<\/li>\n<li>Limits of the assay: analytical sensitivity is about 5% VAF, and it does not reliably detect large structural rearrangements or copy-number changes.<\/li>\n<\/ul>\n<h2>4. Integrated Interpretation<\/h2>\n<p>All four studies point to one diagnosis:<\/p>\n<ol>\n<li><strong>Acute leukemia of myeloid lineage.<\/strong> Morphology, MPO cytochemistry and the flow phenotype (CD34/CD117/CD13/CD33/MPO) all show this.<\/li>\n<li><strong>Monocytic differentiation.<\/strong> Morphology and NSE suggested it, and flow cytometry confirmed it with an expanded CD64-bright, CD14/CD11b/CD11c/CD36+ compartment.<\/li>\n<li><strong>Blast counts differ by method.<\/strong> The counts are 18% on the manual aspirate, 22% by flow, and 41% in peripheral blood, and the core biopsy shows extensive infiltration. The low aspirate count is explained by hemodilution and by promonocytes being counted separately. Promonocytes count as blast equivalents, so adding them (18% + 4%) puts the aspirate near the flow value. <strong>The difference does not affect the diagnosis<\/strong>, because mutated NPM1 defines this entity under WHO and ICC criteria without a 20% blast threshold, as the molecular report states.<\/li>\n<li><strong>Genetics.<\/strong> The karyotype and AML FISH panel are normal. The disease-defining lesion is a type A <strong>NPM1<\/strong> frameshift, with co-occurring <strong>FLT3-ITD<\/strong> and <strong>DNMT3A R882H<\/strong>. The NPM1 VAF of 39% is consistent with heterozygous mutation in most of the cells.<\/li>\n<li><strong>Clinical context.<\/strong> There was no prior cytotoxic therapy and no known antecedent hematologic disorder, which fits de novo disease. None of the reports describe myelodysplasia-related cytogenetic changes or myelodysplasia-related gene mutations; for example, ASXL1, SRSF2, U2AF1, SF3B1, EZH2, BCOR, STAG2 and ZRSR2 were all negative.<\/li>\n<\/ol>\n<h2 id=\"dx-2\">5. Final Diagnosis<\/h2>\n<blockquote>\n<p><strong>Bone marrow, left posterior iliac crest (aspirate and core biopsy):<\/strong>\n<strong>ACUTE MYELOID LEUKEMIA WITH MUTATED NPM1, with monocytic differentiation.<\/strong>\n- Co-mutations: FLT3-ITD (VAF 31%, allelic ratio 0.62) and <mark class=\"lane\">DNMT3A R882H (VAF 44%)\n- Karyotype 46,XY[20]; AML FISH panel negative\n- Marrow 90\u201395% cellular; blasts 18% (aspirate manual differential, plus 4% promonocytes) and 22% (flow); peripheral blood blasts 41%\n- Aberrant immunophenotype: CD56 (partial) and CD7 (subset)<\/mark><\/p>\n<\/blockquote>\n<h2>6. Prognostic and Management Notes<\/h2>\n<p>These notes are limited to what the reports state:<\/p>\n<ul>\n<li><strong>NPM1 mutation:<\/strong> this defines the WHO/ICC entity. The reports do not assign a formal risk category on its own.<\/li>\n<li><strong>FLT3-ITD:<\/strong> the molecular report calls it <strong>prognostically adverse<\/strong> and a <strong>target for FLT3 inhibitor therapy<\/strong>. The allelic ratio of 0.62 is reported to support treatment decisions.<\/li>\n<li><strong>DNMT3A R882H:<\/strong> this commonly co-occurs with NPM1 and FLT3-ITD and is often a clonal hematopoiesis founder event. It does not change the disease category and is reported for possible prognostic relevance.<\/li>\n<li><strong>Adverse-risk markers absent:<\/strong> no TP53 mutation or 17p deletion, no \u22125/5q or \u22127/7q, no KMT2A or MECOM rearrangement, and no complex karyotype.<\/li>\n<li><strong>MRD monitoring:<\/strong> the flow report identifies the aberrant CD56/CD7 phenotype as useful for flow-based MRD tracking.<\/li>\n<li><strong>Not in the source reports:<\/strong> none of them assigns a formal integrated risk category (such as ELN), so this report does not state one. Formal risk assignment and treatment planning rest with the treating hematologist.<\/li>\n<\/ul>\n<h2>7. Comments and Limitations<\/h2>\n<ul>\n<li>The morphology component was signed out before the ancillary studies were available. Its final classification has now been resolved by integration.<\/li>\n<li>The molecular assay cannot exclude variants below about 5% VAF or structural and copy-number changes outside the karyotype and FISH targets.<\/li>\n<li>The morphology report's footer reads \"Page 1 of 1\" although the report runs to two pages. This is a minor formatting inconsistency and does not affect the content.<\/li>\n<\/ul>\n<p><em>This integrated report was compiled from the four component reports listed above.<\/em><\/p>", "headings": ["1. Patient and Specimen Identifiers", "2. Clinical History", "3. Summary by Study", "4. Integrated Interpretation", "5. Final Diagnosis", "6. Prognostic and Management Notes", "7. Comments and Limitations"], "checks": {"npm1_in_dx": true, "dnmt3a_out_of_dx": false, "blast_reconciled": true, "dnmt3a_in_prog": true, "flt3_in_dx": true}}, {"run": 3, "html": "<h1>Integrated Hematopathology Report<\/h1>\n<h2>Patient Identifiers<\/h2>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Patient<\/td>\n<td>DOE, JONATHAN R.<\/td>\n<\/tr>\n<tr>\n<td>MRN<\/td>\n<td>MRN-4471902<\/td>\n<\/tr>\n<tr>\n<td>DOB / Age / Sex<\/td>\n<td>1967-09-14 / 58 y / Male<\/td>\n<\/tr>\n<tr>\n<td>Ordering provider<\/td>\n<td>Anjali R. Patel, MD (Hematology/Oncology)<\/td>\n<\/tr>\n<tr>\n<td>Location<\/td>\n<td>Inpatient, 6 West Hematology, Riverbend Regional Medical Center<\/td>\n<\/tr>\n<tr>\n<td>Specimen<\/td>\n<td>Bone marrow, left posterior iliac crest (aspirate and core biopsy)<\/td>\n<\/tr>\n<tr>\n<td>Collected<\/td>\n<td>2026-04-22<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Component accessions<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Study<\/th>\n<th>Accession<\/th>\n<th>Reported<\/th>\n<th>Signed by<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bone marrow morphology<\/td>\n<td>S26-BM-01187<\/td>\n<td>2026-04-24<\/td>\n<td>Marcus T. Whitfield, MD<\/td>\n<\/tr>\n<tr>\n<td>Flow cytometry<\/td>\n<td>FC-26-003942<\/td>\n<td>2026-04-23<\/td>\n<td>Priya N. Raghavan, MD<\/td>\n<\/tr>\n<tr>\n<td>Cytogenetics / FISH<\/td>\n<td>CG-26-00871<\/td>\n<td>2026-04-29<\/td>\n<td>Helena V. Brandt, PhD, FACMG<\/td>\n<\/tr>\n<tr>\n<td>Molecular NGS (Meridian Molecular Diagnostics)<\/td>\n<td>MMD-26-NGS-22150<\/td>\n<td>2026-05-04<\/td>\n<td>Daniel U. Okafor, MD, PhD; Lucia M. Fernandez, PhD<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Clinical History<\/h2>\n<p>58-year-old man with three weeks of progressive fatigue, dyspnea on exertion, gingival bleeding, and lower-extremity ecchymoses. Admission CBC: WBC 38.4 x10^9/L, hemoglobin 7.9 g/dL, platelets 31 x10^9/L. Peripheral smear showed 41% circulating blasts, some with folded nuclei and abundant cytoplasm. No prior hematologic disease, chemotherapy, or radiation.<\/p>\n<h2>Summary by Modality<\/h2>\n<h3>1. Morphology (S26-BM-01187)<\/h3>\n<ul>\n<li><strong>Core biopsy:<\/strong> markedly hypercellular (about 90-95%), with sheets of immature mononuclear cells replacing the marrow. Residual hematopoiesis is markedly decreased, megakaryocytes are markedly reduced, and there is no significant fibrosis (MF-1).<\/li>\n<li><strong>Aspirate:<\/strong> 18% blasts on a 500-cell differential, plus 4% promonocytes counted separately. Blasts have fine chromatin and prominent nucleoli, and a subset has folded nuclei and grayish cytoplasm. No Auer rods were seen. Erythropoiesis is left-shifted with mild megaloblastoid change. No ring sideroblasts.<\/li>\n<li><strong>Cytochemistry:<\/strong> MPO positive in about 5-10% of blasts. NSE positive in a subset, with partial fluoride inhibition.<\/li>\n<li><strong>Impression:<\/strong> AML with probable monocytic differentiation. The pathologist notes the aspirate count is probably underestimated because of hemodilution and the difficulty of separating promonocytes from blasts.<\/li>\n<\/ul>\n<h3>2. Flow Cytometry (FC-26-003942)<\/h3>\n<ul>\n<li><strong>Myeloid blasts: 22% of total nucleated cells.<\/strong> Phenotype: CD34+ (about 60%), CD117+, HLA-DR bright, CD13+, CD33 bright, CD38+, dim cytoplasmic MPO, CD64+, dim CD4, partial CD11b, CD14-negative. Aberrant <strong>CD56 (partial)<\/strong> and <strong>CD7 (subset)<\/strong>. Negative for CD2, CD19, and cyCD3.<\/li>\n<li><strong>Monocytic compartment: about 30% combined.<\/strong> This is 19% maturing monocytes and 11% promonocytes/immature monocytic cells, expressing bright uniform CD64, CD14 (on maturing cells), CD11b, CD11c, CD36, HLA-DR, and dim CD4, with partial CD56.<\/li>\n<li>Lymphocytes are polytypic with no aberrancy.<\/li>\n<li><strong>Impression:<\/strong> diagnostic of AML with monocytic differentiation. Flow confirms the monocytic lineage that morphology could only favor.<\/li>\n<\/ul>\n<h3>3. Cytogenetics and FISH (CG-26-00871)<\/h3>\n<ul>\n<li><strong>Karyotype: 46,XY[20].<\/strong> The karyotype is a normal male complement.<\/li>\n<li><strong>AML FISH panel was negative<\/strong> for RUNX1-RUNX1T1, CBFB, PML-RARA, KMT2A, MECOM, -5/5q-, -7/7q-, and TP53/17p deletion.<\/li>\n<li><strong>Impression:<\/strong> cytogenetically normal AML.<\/li>\n<\/ul>\n<h3>4. Molecular NGS, 54-gene myeloid panel (MMD-26-NGS-22150)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Gene<\/th>\n<th>Variant<\/th>\n<th>VAF<\/th>\n<th>Tier<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>NPM1<\/strong><\/td>\n<td>c.860_863dup, p.(Trp288CysfsTer12), type A frameshift<\/td>\n<td>39%<\/td>\n<td>I<\/td>\n<\/tr>\n<tr>\n<td><strong>FLT3<\/strong><\/td>\n<td>ITD, exon 14 (~36 bp); ITD/WT allelic ratio 0.62<\/td>\n<td>31%<\/td>\n<td>I<\/td>\n<\/tr>\n<tr>\n<td><strong>DNMT3A<\/strong><\/td>\n<td>c.2645G&gt;A, p.(Arg882His), R882 hotspot<\/td>\n<td>44%<\/td>\n<td>II<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>No reportable variants were found in CEBPA, RUNX1, TP53, ASXL1, IDH1/2, NRAS/KRAS, KIT, TET2, the splicing-factor genes (SRSF2, U2AF1, SF3B1, ZRSR2), EZH2, BCOR, STAG2, WT1, or the other genes listed.<\/li>\n<\/ul>\n<h2>Integrated Interpretation<\/h2>\n<p>All four studies agree on a single process:<\/p>\n<ol>\n<li><strong>AML is established.<\/strong> The marrow is replaced on core biopsy, there are 41% peripheral blasts, and flow shows an abnormal myeloid blast population with aberrant CD56/CD7.<\/li>\n<li><strong>The leukemia is monocytic.<\/strong> Morphology (folded nuclei, NSE positivity with fluoride inhibition) suggested monocytic differentiation, and flow confirmed it (an expanded immature monocytic compartment with bright CD64, CD11b, CD36, and dim CD4). This matches the phenotype typical of NPM1-mutated AML: weak or partial CD34 and MPO, a prominent monocytic component, and cup-like or folded nuclear forms.<\/li>\n<li><strong>The genetics define the entity.<\/strong> The karyotype is normal and FISH is negative. The NGS panel found a type A NPM1 mutation, which the reference laboratory states is a WHO and ICC disease-defining abnormality.<\/li>\n<li><strong>Reconciling the blast counts.<\/strong> The values differ: 18% on the aspirate manual count (blasts only), 22% by flow, 41% in peripheral blood, and much higher on the core. The pathologist and flow director both explain this as hemodilution and the subjective separation of promonocytes from blasts. <strong>This difference does not affect classification.<\/strong> Because NPM1-mutated AML is defined genetically, the 20% blast threshold is not required, as the morphology and molecular reports both state.<\/li>\n<li><strong>The DNMT3A R882H variant<\/strong> has the highest VAF (44%) and probably represents a clonal hematopoiesis founder event. The NPM1 and FLT3-ITD variants appear to be later events in the leukemic clone. The molecular report states that DNMT3A does not change the disease category.<\/li>\n<\/ol>\n<h2 id=\"dx-3\">Final Diagnosis<\/h2>\n<p><strong>BONE MARROW, LEFT POSTERIOR ILIAC CREST (ASPIRATE, CORE BIOPSY, AND ANCILLARY STUDIES):<\/strong><\/p>\n<p><strong>ACUTE MYELOID LEUKEMIA WITH MUTATED NPM1 (WHO / ICC), with monocytic differentiation.<\/strong>\n- Concurrent <strong>FLT3 internal tandem duplication<\/strong> (VAF 31%, allelic ratio 0.62).\n- Concurrent <strong><mark class=\"lane\">DNMT3A R882H<\/mark><\/strong> (VAF 44%).\n- Normal male karyotype, 46,XY[20]; negative AML FISH panel.\n- Hypercellular marrow (90-95%) with extensive leukemic infiltration. Blasts 18% (aspirate manual count) and 22% (flow), with 41% in peripheral blood.\n- Aberrant blast immunophenotype: CD56 partial and CD7 subset.<\/p>\n<h2>Prognostic and Management Notes<\/h2>\n<p>These notes summarize what the source reports state.<\/p>\n<ul>\n<li><strong>FLT3-ITD:<\/strong> the molecular report calls it prognostically adverse and a target for FLT3 inhibitor therapy. The allelic ratio of 0.62 is reported to support treatment decisions.<\/li>\n<li><strong>NPM1 mutation:<\/strong> this is the disease-defining lesion. A specific type A variant has been identified, so it could also serve as a molecular MRD marker. The reports do not explicitly say this, so confirm with the molecular laboratory.<\/li>\n<li><strong>DNMT3A R882H:<\/strong> frequently co-occurs with NPM1 and FLT3-ITD. The report lists it for completeness and \"potential prognostic relevance\" but does not state a specific effect.<\/li>\n<li><strong>Adverse cytogenetic and molecular lesions not found:<\/strong> TP53, KMT2A, MECOM, -5/5q-, -7/7q-, and the ASXL1, RUNX1, and splicing-factor mutations tested on the panel were all negative.<\/li>\n<li><strong>MRD tracking:<\/strong> the flow report notes that aberrant CD56 and CD7 expression may help with flow-based MRD monitoring.<\/li>\n<li><strong>Not covered by the provided reports:<\/strong> a formal risk category (for example, ELN classification), specific therapy recommendations, and survival estimates. These should be determined by the treating hematology/oncology team.<\/li>\n<\/ul>\n<h2>Limitations<\/h2>\n<ul>\n<li>The NGS assay reliably detects variants down to about 5% VAF. It does not reliably detect structural or copy-number changes, and a negative result does not exclude low-level mutations.<\/li>\n<li>A normal karyotype at 400-425 band resolution does not exclude submicroscopic abnormalities.<\/li>\n<li>Each component report states that it is not meant to stand alone. This integrated summary combines them, but it should be reviewed and signed by the responsible hematopathologist before clinical use.<\/li>\n<\/ul>", "headings": ["Patient Identifiers", "Clinical History", "Summary by Modality", "Integrated Interpretation", "Final Diagnosis", "Prognostic and Management Notes", "Limitations"], "checks": {"npm1_in_dx": true, "dnmt3a_out_of_dx": false, "blast_reconciled": true, "dnmt3a_in_prog": true, "flt3_in_dx": true}}], "extract": {"MORPH": {"source_id": "MORPH", "display_name": "Bone marrow aspirate and core biopsy morphology", "summary": "Bone marrow aspirate and core biopsy (left posterior iliac crest) from a 58-year-old man with peripheral blood showing 41% circulating blasts. The marrow is markedly hypercellular (approximately 90-95%) with extensive replacement by immature mononuclear cells in sheets. The 500-cell aspirate differential gives 18% blasts, with promonocytes (4%) enumerated separately because their assignment is morphologically subjective. Blasts are medium-to-large with fine chromatin and one to three nucleoli; a subset shows folded or indented nuclei with grayish cytoplasm. No definite Auer rods are seen. MPO is positive in a minor subset of blasts (approximately 5-10%), and NSE is positive in a subset of cells with partial fluoride inhibition. The diagnosis is hypercellular marrow with acute myeloid leukemia, with probable monocytic differentiation to be confirmed by flow cytometry. The report states that the aspirate blast count is below the historical 20% threshold, that aspirate enumeration is likely affected by hemodilution and by difficulty separating promonocytes from blasts, and that classification depends on pending flow cytometry, cytogenetic, and molecular results.", "key_findings": [{"text": "Diagnosis: hypercellular marrow with acute myeloid leukemia.", "verbatim_support": "HYPERCELLULAR MARROW WITH ACUTE MYELOID LEUKEMIA (see comment)", "category": "lineage", "_verified": true}, {"text": "Aspirate blast count is 18% by 500-cell manual differential.", "verbatim_support": "Aspirate blast count 18% by 500-cell manual differential", "category": "blast_burden", "_verified": true}, {"text": "Core biopsy shows extensive blast-equivalent infiltration.", "verbatim_support": "core biopsy with extensive blast-equivalent infiltration", "category": "blast_burden", "_verified": true}, {"text": "Core is markedly hypercellular (approximately 90-95%) with extensive replacement by immature mononuclear cells in sheets.", "verbatim_support": "The core is markedly hypercellular (cellularity approximately 90-95%) with extensive replacement by", "category": "blast_burden", "_verified": true}, {"text": "Peripheral blood blast count is 41%.", "verbatim_support": "the peripheral blood blast count is 41%", "category": "blast_burden", "_verified": true}, {"text": "Promonocytes (4%) were counted separately from blasts; their assignment is described as morphologically subjective.", "verbatim_support": "Promonocytes were enumerated separately; their assignment is morphologically subjective", "category": "blast_burden", "_verified": true}, {"text": "Monocytic differentiation is stated as probable, based on morphology and cytochemistry, and is to be confirmed by flow cytometry.", "verbatim_support": "Probable monocytic differentiation by morphology and cytochemistry; to be confirmed by flow cytometry.", "category": "lineage", "_verified": true}, {"text": "Unequivocal promonocytes are difficult to distinguish from immature myeloid forms on morphology alone.", "verbatim_support": "unequivocal promonocytes are difficult to", "category": "lineage", "_verified": true}, {"text": "A subset of blasts shows slightly folded or indented nuclei with grayish cytoplasm and occasional fine azurophilic granulation.", "verbatim_support": "A subset of blasts shows slightly folded or indented", "category": "lineage", "_verified": true}, {"text": "No definite Auer rods were identified after review of multiple smears.", "verbatim_support": "No definite Auer rods are identified after review of multiple", "category": "lineage", "_verified": true}, {"text": "MPO is positive in a minor subset of blasts (approximately 5-10%).", "verbatim_support": "positive in a minor subset of blasts (approximately 5-10%)", "category": "biomarker", "_verified": true}, {"text": "NSE is positive in a subset of cells with partial fluoride inhibition, which the report says supports a monocytic component.", "verbatim_support": "positive in a subset of cells with partial fluoride inhibition, supporting a monocytic component", "category": "biomarker", "_verified": true}, {"text": "The combined cytochemical pattern is consistent with a myeloid process with probable monocytic differentiation.", "verbatim_support": "combined pattern is consistent with a myeloid process with probable monocytic differentiation", "category": "lineage", "_verified": true}, {"text": "Erythropoiesis is left-shifted with mild megaloblastoid change, and megakaryocytes are reduced.", "verbatim_support": "Erythropoiesis is left-shifted with mild megaloblastoid change", "category": "other", "_verified": true}, {"text": "Reticulin shows no significant fibrosis (MF-1).", "verbatim_support": "shows no significant fibrosis (MF-1)", "category": "other", "_verified": true}, {"text": "Storage iron is present, with no ring sideroblasts.", "verbatim_support": "storage iron present; no ring sideroblasts", "category": "other", "_verified": true}, {"text": "Aspirate blast percentage is below the historical 20% threshold.", "verbatim_support": "The manual aspirate blast percentage (18%) is below the historical 20% threshold", "category": "limitation", "_verified": true}, {"text": "Aspirate enumeration is likely affected by hemodilution and by difficulty separating promonocytes from myeloid blasts.", "verbatim_support": "enumeration is likely affected by hemodilution and by the difficulty of separating promonocytes from myeloid blasts on smears", "category": "limitation", "_verified": true}, {"text": "Classification depends on integration with flow cytometry, cytogenetic, and molecular results, which were pending at the time of the report.", "verbatim_support": "classification will therefore depend on integration with flow cytometry, cytogenetic, and", "category": "limitation", "_verified": true}], "stated_limitations": "The manual aspirate blast percentage (18%) is below the historical 20% threshold. Aspirate enumeration is likely affected by hemodilution and by the difficulty of separating promonocytes from myeloid blasts on smears. Promonocyte assignment is morphologically subjective, and unequivocal promonocytes are difficult to distinguish from immature myeloid forms on morphology alone. Monocytic differentiation is probable only and is to be confirmed by flow cytometry. Classification depends on flow cytometry, cytogenetic, and molecular results that were pending at the time of the report. The report is a morphology component report that is part of a larger diagnostic episode and is not intended to stand alone.", "molecular_variants": []}, "FLOW": {"source_id": "FLOW", "display_name": "Flow cytometry immunophenotyping", "summary": "Flow cytometry of a bone marrow aspirate (viability 94% by 7-AAD; eight-color panel, CD45 vs side scatter gating) shows an abnormal myeloid blast population of approximately 22% of total nucleated cells expressing CD34 (subset, ~60%), CD117, HLA-DR (bright), CD13, CD33 (bright), CD38, CD64, dim CD4 and dim cytoplasmic MPO, with aberrant CD56 (partial) and CD7 (subset); CD14 negative on blasts and CD2/CD19/cyCD3 negative. There is a markedly expanded, left-shifted monocytic compartment (maturing monocytes 19% plus promonocytes/immature monocytic 11%, together approximately 30% of TNC) with bright uniform CD64, CD14 on the maturing fraction, CD11b, CD11c, CD36, HLA-DR and dim CD4. The report states the combined findings are diagnostic of acute myeloid leukemia with monocytic differentiation and that the immunophenotype establishes the monocytic lineage that was only favored on morphology. It notes the flow blast estimate (22%) differs modestly from the manual aspirate differential, that aberrant CD56/CD7 may be useful for MRD tracking, and that correlation with cytogenetic and molecular studies is required for final classification.", "key_findings": [{"text": "Abnormal myeloid blast population comprising approximately 22% of total nucleated cells.", "verbatim_support": "abnormal myeloid blast population comprising approximately 22% of total nucleated cells", "category": "blast_burden", "_verified": true}, {"text": "Blasts express CD34, CD117, HLA-DR, CD13, CD33, and dim cytoplasmic MPO.", "verbatim_support": "expressing\nCD34, CD117, HLA-DR, CD13, CD33, and dim cytoplasmic MPO", "category": "lineage", "_verified": true}, {"text": "CD34 is positive on a subset (~60%) of blasts.", "verbatim_support": "CD34 Positive (subset, ~60%)", "category": "other", "_verified": true}, {"text": "Aberrant CD56 and partial CD7 expression on blasts.", "verbatim_support": "with aberrant CD56 and partial CD7", "category": "other", "_verified": true}, {"text": "CD14 is negative on blasts; CD2, CD19 and cyCD3 are negative.", "verbatim_support": "CD14 Negative on blasts", "category": "lineage", "_verified": true}, {"text": "Markedly expanded and left-shifted monocytic compartment, maturing monocytes plus promonocytes together approximately 30% of total nucleated cells.", "verbatim_support": "maturing monocytes plus promonocytes together approximately 30% of total\nnucleated cells", "category": "lineage", "_verified": true}, {"text": "Monocytic population shows bright uniform CD64, CD14 on the maturing fraction, CD11b, CD11c, CD36, HLA-DR, and dim CD4.", "verbatim_support": "with bright uniform CD64, CD14 on the maturing fraction, CD11b, CD11c, CD36, HLA-DR, and dim CD4", "category": "lineage", "_verified": true}, {"text": "Combined findings reported as diagnostic of acute myeloid leukemia with monocytic differentiation.", "verbatim_support": "The combined findings are diagnostic of acute myeloid leukemia with monocytic differentiation", "category": "lineage", "_verified": true}, {"text": "Report states the immunophenotype establishes the monocytic lineage that was only favored on morphology.", "verbatim_support": "The immunophenotype\nestablishes the monocytic lineage that was only favored on morphology", "category": "lineage", "_verified": true}, {"text": "Flow blast estimate (22%) differs modestly from the manual aspirate differential; report states either value supports the diagnosis.", "verbatim_support": "the flow blast estimate (22%) differs modestly from\nthe manual aspirate differential", "category": "limitation", "_verified": true}, {"text": "Aberrant CD56/CD7 expression may be useful for measurable residual disease tracking.", "verbatim_support": "Aberrant CD56/CD7 expression is noted and may be useful for measurable residual disease tracking", "category": "biomarker", "_verified": true}, {"text": "Correlation with cytogenetic and molecular studies is required for final classification.", "verbatim_support": "Correlation with\ncytogenetic and molecular studies is required for final classification", "category": "limitation", "_verified": true}, {"text": "Specimen viability 94% by 7-AAD.", "verbatim_support": "viability 94% by 7-AAD", "category": "other", "_verified": true}], "stated_limitations": "The flow blast estimate (22%) differs modestly from the manual aspirate differential; the report states flow gating and manual counts are expected to differ and either value supports the diagnosis in this context. Correlation with cytogenetic and molecular studies is required for final classification. Flow cytometry is a component study within a combined diagnostic workup; final lineage and classification require integration with morphology, cytogenetics, and molecular results. Method is a laboratory-developed test with performance characteristics established by the performing laboratory.", "molecular_variants": []}, "CYTO": {"source_id": "CYTO", "display_name": "Cytogenetics + FISH panel", "summary": "G-banded chromosome analysis of an unstimulated bone marrow aspirate (24- and 48-hour synchronized cultures; 20 cells counted, 5 karyotyped; 400-425 bphs) showed a normal male karyotype, 46,XY[20], with no clonal numerical or structural abnormality at the stated band resolution. Interphase FISH using the acute myeloid leukemia panel (200 nuclei scored per probe) was negative for RUNX1-RUNX1T1, CBFB, PML-RARA, KMT2A (MLL), MECOM (EVI1), -5/5q- (EGR1), -7/7q- (D7S486), and TP53 (17p13.1) deletion, with all signal counts within the laboratory's normal cutoff range. The report interprets the case as cytogenetically normal, states that a normal karyotype does not exclude a submicroscopic abnormality, and states that molecular testing (NPM1, FLT3, CEBPA, and a broader myeloid panel) is required for classification and risk stratification and has been ordered separately (accession MMD-26-NGS-22150).", "key_findings": [{"text": "Conventional karyotype: normal male karyotype in all 20 metaphase cells analyzed.", "verbatim_support": "46,XY[20]", "category": "genetics", "_verified": true}, {"text": "No clonal numerical or structural abnormality was identified at the stated band resolution (400-425 bphs).", "verbatim_support": "No clonal numerical or structural abnormality was identified at the stated band resolution", "category": "genetics", "_verified": true}, {"text": "Analysis scope: 20 cells counted, 5 fully karyotyped.", "verbatim_support": "Twenty metaphase cells were analyzed and five were fully karyotyped", "category": "other", "_verified": true}, {"text": "FISH RUNX1-RUNX1T1 for t(8;21)(q22;q22): negative (0.5% nuclei).", "verbatim_support": "RUNX1-RUNX1T1 t(8;21)(q22;q22) NEGATIVE 0.5%", "category": "genetics", "_verified": true}, {"text": "FISH CBFB for inv(16)/t(16;16)(p13;q22): negative (1.0% nuclei).", "verbatim_support": "CBFB inv(16)/t(16;16)(p13;q22) NEGATIVE 1.0%", "category": "genetics", "_verified": true}, {"text": "FISH PML-RARA for t(15;17)(q24;q21): negative (0.5% nuclei).", "verbatim_support": "PML-RARA t(15;17)(q24;q21) NEGATIVE 0.5%", "category": "genetics", "_verified": true}, {"text": "FISH KMT2A (MLL) for 11q23.3 rearrangement: negative (1.5% nuclei).", "verbatim_support": "KMT2A (MLL) 11q23.3 rearrangement NEGATIVE 1.5%", "category": "genetics", "_verified": true}, {"text": "FISH MECOM (EVI1) for 3q26.2 rearrangement: negative (1.0% nuclei).", "verbatim_support": "MECOM (EVI1) 3q26.2 rearrangement NEGATIVE 1.0%", "category": "genetics", "_verified": true}, {"text": "FISH -5/5q- (EGR1) for deletion 5q31: negative (1.5% nuclei).", "verbatim_support": "-5/5q- (EGR1) deletion 5q31 NEGATIVE 1.5%", "category": "genetics", "_verified": true}, {"text": "FISH -7/7q- (D7S486) for monosomy 7 / del(7q): negative (1.0% nuclei).", "verbatim_support": "-7/7q- (D7S486) monosomy 7 / del(7q) NEGATIVE 1.0%", "category": "genetics", "_verified": true}, {"text": "FISH TP53 (17p13.1) for deletion 17p: negative (2.0% nuclei).", "verbatim_support": "TP53 (17p13.1) deletion 17p NEGATIVE 2.0%", "category": "genetics", "_verified": true}, {"text": "All FISH probe signal counts were within the laboratory's normal cutoff range.", "verbatim_support": "All probe signal counts were within the laboratory's established normal cutoff range", "category": "g A R882H missense (c.2645G>A, VAF 44%, Tier II). No reportable variant was detected in the listed selected genes including CEBPA, RUNX1, TP53, ASXL1, IDH1, IDH2, and others. The interpretation states that, in the context of an AML established by morphology and flow cytometry, mutated NPM1 is a WHO and ICC disease-defining abnormality and the diagnosis is therefore acute myeloid leukemia with mutated NPM1, with no 20% blast threshold required. FLT3-ITD is described as prognostically adverse and a therapeutic target; DNMT3A R882H is described as not by itself defining or changing the WHO/ICC category. Correlation with morphology, flow cytometry, and cytogenetics is recommended.", "key_findings": [{"text": "Overall result positive for clinically significant variants: NPM1 (Tier I), FLT3-ITD (Tier I), DNMT3A (Tier II).", "verbatim_support": "POSITIVE \u2014 Clinically significant variants detected.", "category": "genetics", "_verified": true}, {"text": "NPM1 type A frameshift insertion (4-bp TCTG duplication), VAF 39%, Tier I.", "verbatim_support": "mutated NPM1 variant (type A frameshift insertion, VAF 39%)", "category": "genetics", "_verified": true}, {"text": "FLT3 internal tandem duplication, exon 14 (~36 bp insertion), VAF 31%, ITD/WT allelic ratio 0.62, Tier I.", "verbatim_support": "FLT3 internal tandem duplication (VAF 31%, ITD/WT allelic ratio 0.62)", "category": "genetics", "_verified": true}, {"text": "DNMT3A R882H missense hotspot variant, VAF 44%, Tier II.", "verbatim_support": "DNMT3A R882H missense variant (VAF 44%)", "category": "genetics", "_verified": true}, {"text": "No reportable variant in selected genes including CEBPA, RUNX1, TP53, ASXL1, IDH1, IDH2, NRAS, KRAS, KIT, TET2 and others listed.", "verbatim_support": "No reportable variant detected in: CEBPA, RUNX1, TP53, ASXL1, IDH1, IDH2", "category": "genetics", "_verified": true}, {"text": "Report states the diagnosis is AML with mutated NPM1, conditional on AML being established by morphology and flow cytometry; NPM1 is described as WHO and ICC disease-defining.", "verbatim_support": "the diagnosis is therefore acute myeloid leukemia with mutated NPM1", "category": "lineage", "_verified": true}, {"text": "Report states a 20% blast threshold is not required for this entity.", "verbatim_support": "a blast threshold of 20% is not required for this entity", "category": "blast_burden", "_verified": true}, {"text": "FLT3-ITD described as prognostically adverse and a target for FLT3 inhibitor therapy.", "verbatim_support": "The concurrent FLT3-ITD is prognostically adverse and is a target for FLT3 inhibitor therapy", "category": "biomarker", "_verified": true}, {"text": "DNMT3A R882H described as frequently a clonal hematopoiesis founder event that does not by itself define or change the WHO/ICC category.", "verbatim_support": "it does not by itself define or change the WHO/ICC disease category", "category": "biomarker", "_verified": true}, {"text": "Report recommends correlation with morphology, flow cytometry, and cytogenetics and describes itself as one component of the integrated workup.", "verbatim_support": "Correlation with morphology, flow cytometry, and cytogenetics is recommended", "category": "other", "_verified": true}, {"text": "Assay does not reliably detect large structural rearrangements or copy-number changes; analytical sensitivity approximately 5% VAF.", "verbatim_support": "The assay does not reliably detect large structural rearrangements, copy-number changes", "category": "limitation", "_verified": true}], "stated_limitations": "Analytical sensitivity approximately 5% VAF for single-nucleotide variants and small indels; FLT3-ITD detection supplemented by capillary fragment analysis. The assay does not reliably detect large structural rearrangements, copy-number changes, or variants in regions of low coverage or high homology. A negative result does not exclude a mutation below the limit of detection. Laboratory-developed test validated by Meridian Molecular Diagnostics; not cleared or approved by the FDA. FLT3-ITD allelic ratio estimated by fragment analysis run in parallel. Full 54-gene list and coverage metrics retained by the laboratory in an appendix.", "molecular_variants": [{"gene": "NPM1", "variant": "NM_002520.7:c.860_863dup p.(Trp288CysfsTer12)", "vaf": "39%", "tier": "I", "classifying": true, "prognostic_note": "Reported as a WHO and ICC disease-defining genetic abnormality (AML with mutated NPM1); no separate prognostic statement given in the report.", "verbatim_support": "mutated NPM1 is a World Health Organization and ICC disease-defining genetic abnormality", "_verified": true}, {"gene": "FLT3", "variant": "Internal tandem duplication, exon 14 (~36 bp insertion)", "vaf": "31%", "tier": "I", "classifying": false, "prognostic_note": "Prognostically adverse and a target for FLT3 inhibitor therapy; ITD/WT allelic ratio 0.62 reported to support treatment decisions.", "verbatim_support": "The concurrent FLT3-ITD is prognostically adverse and is a target for FLT3 inhibitor therapy", "_verified": true}, {"gene": "DNMT3A", "variant": "NM_022552.5:c.2645G>A p.(Arg882His)", "vaf": "44%", "tier": "II", "classifying": false, "prognostic_note": "Commonly co-mutated with NPM1 and FLT3-ITD; frequently a clonal hematopoiesis founder event; reported for completeness and potential prognostic relevance.", "verbatim_support": "it does not by itself define or change the WHO/ICC disease category", "_verified": true}]}}, "raw": {"MORPH": "\n=== PAGE 1 ===\n\nRiverbend Regional Medical Center\nDepartment of Pathology & Laboratory Medicine\n1200 Halsted Avenue, Lakeshore, IL 60000 (cid:127) CLIA 14D9999999\nHEMATOPATHOLOGY \u2014 BONE MARROW EXAMINATION\nPatient: DOE, JONATHAN R. Accession: S26-BM-01187\nMRN: MRN-4471902 Collected: 2026-04-22\nDOB / Age / Sex: 1967-09-14 / 58 y / Male Reported: 2026-04-24\nOrdering provider: Patel, Anjali R., MD (Hematology/Oncology) Location: Inpatient \u2014 6 West Hematology\nSPECIMEN\nBone marrow, left posterior iliac crest (aspirate and core biopsy). Aspirate smears (Wright-Giemsa), clot section, and decalcified\ncore biopsy (H&E) received. Aspirate also submitted for flow cytometry, cytogenetics, and molecular studies under separate\naccession.\nCLINICAL HISTORY\n58-year-old man with three weeks of progressive fatigue, dyspnea on exertion, gingival bleeding, and scattered lower-extremity\necchymoses. CBC on admission: WBC 38.4 x10^9/L, hemoglobin 7.9 g/dL, platelets 31 x10^9/L. Peripheral smear with 41%\ncirculating blasts, some with folded nuclei and abundant cytoplasm. No prior hematologic history, no prior chemotherapy or\nradiation. Bone marrow performed to evaluate for acute leukemia.\nASPIRATE DIFFERENTIAL (500-cell count)\nCell type % Cell type %\nBlasts 18 Lymphocytes 9\nPromyelocytes 3 Plasma cells 1\nMyelocytes / metamyelocytes 8 Monocytes (mature) 6\nNeutrophils / bands 21 Promonocytes* 4\nEosinophils 2 Erythroid precursors 14\nBasophils 1 M:E ratio ~4.4:1\n* Promonocytes were enumerated separately; their assignment is morphologically subjective and is discussed below.\nMICROSCOPIC DESCRIPTION\nAspirate. Smears are adequately cellular and spicular. There is a population of medium-to-large blasts with high\nnuclear-to-cytoplasmic ratio, fine chromatin, and one to three nucleoli. A subset of blasts shows slightly folded or indented\nnuclei with moderate amounts of grayish cytoplasm and occasional fine azurophilic granulation; rare cells contain delicate\ncytoplasmic vacuoles. Occasional cells with monocytoid features are noted, but unequivocal promonocytes are difficult to\ndistinguish from immature myeloid forms on morphology alone. No definite Auer rods are identified after review of multiple\nsmears. Erythropoiesis is left-shifted with mild megaloblastoid change. Megakaryocytes are reduced.\nCore biopsy and clot. The core is markedly hypercellular (cellularity approximately 90-95%) with extensive replacement by\nimmature mononuclear cells arranged in sheets. Interstitial and paratrabecular distribution is noted. Residual maturing\ngranulopoiesis and erythropoiesis are present but markedly decreased. Megakaryocytes are markedly reduced. Reticulin stain\nshows no significant fibrosis (MF-1). Iron stain (aspirate): storage iron present; no ring sideroblasts.\nCYTOCHEMISTRY\nMyeloperoxidase (MPO): positive in a minor subset of blasts (approximately 5-10%). Non-specific esterase (NSE,\nalpha-naphthyl butyrate): positive in a subset of cells with partial fluoride inhibition, supporting a monocytic component. The\ncombined pattern is consistent with a myeloid process with probable monocytic differentiation; correlation with flow cytometry\nis recommended.\nDIAGNOSIS\nBONE MARROW, ASPIRATE AND CORE BIOPSY (LEFT POSTERIOR ILIAC CREST):\n\u2014 HYPERCELLULAR MARROW WITH ACUTE MYELOID LEUKEMIA (see comment).\n\u2014 Aspirate blast count 18% by 500-cell manual differential; core biopsy with extensive blast-equivalent infiltration.\n\n=== PAGE 2 ===\n\n\u2014 Probable monocytic differentiation by morphology and cytochemistry; to be confirmed by flow cytometry.\nCOMMENT\nThe manual aspirate blast percentage (18%) is below the historical 20% threshold; however, the core biopsy demonstrates\nextensive infiltration by immature cells well in excess of that proportion, and the peripheral blood blast count is 41%. Aspirate\nenumeration is likely affected by hemodilution and by the difficulty of separating promonocytes from myeloid blasts on smears.\nUnder current WHO and ICC classifications, a diagnosis of acute myeloid leukemia does not require a 20% blast count when a\ndefining genetic abnormality is present; classification will therefore depend on integration with flow cytometry, cytogenetic, and\nmolecular results, which are pending at the time of this report. A combined integrated interpretation will follow once all\nancillary studies are available.\nElectronically signed: Marcus T. Whitfield, MD \u2014 Hematopathology. Resident/fellow review: K. Aboud, MD. Report status: FINAL (morphology\ncomponent). This component report is part of a larger diagnostic episode and is not intended to stand alone.\nPage 1 of 1 (cid:127) Accession S26-BM-01187 (cid:127) MRN-4471902", "FLOW": "\n=== PAGE 1 ===\n\nFLOW CYTOMETRY LABORATORY\nRiverbend Regional Medical Center 1200 Halsted Avenue, Lakeshore, IL 60000\nCLIA 14D9999999\nCLINICAL FLOW CYTOMETRY \u2014 LEUKEMIA / LYMPHOMA IMMUNOPHENOTYPING\nPATIENT SPECIMEN REPORTING\nDOE, JONATHAN R. FC-26-003942 Resulted 2026-04-23\nMRN MRN-4471902 Bone marrow aspirate Ordering: A. Patel, MD\nDOB 1967-09-14 58 y / Male Collected 2026-04-22 Status: FINAL\nReceived 2026-04-22 17:40 Priority: STAT\nCLINICAL HISTORY / INDICATION\n58-year-old man with three weeks of progressive fatigue, dyspnea on exertion, gingival bleeding, and scattered lower-extremity\necchymoses. CBC on admission: WBC 38.4 x10^9/L, hemoglobin 7.9 g/dL, platelets 31 x10^9/L. Peripheral smear with 41% circulating\nblasts, some with folded nuclei and abundant cytoplasm. No prior hematologic history, no prior chemotherapy or radiation. Bone marrow\nperformed to evaluate for acute leukemia.\nSPECIMEN ADEQUACY & METHOD\nViable nucleated cells isolated from bone marrow aspirate; viability 94% by 7-AAD. Eight-color panel acquired on a 3-laser cytometer\n(\u2021100,000 events per tube). Lysis/no-wash technique. Analysis by sequential gating (CD45 vs side scatter) with blast gate defined by\nCD45-dim/intermediate, low side scatter events.\nPOPULATION SUMMARY (% of total nucleated cells)\nPopulation % TNC Gating notes\nMyeloid blasts (CD45-dim, low SSC, CD34+/CD117+) 22% Discrete abnormal population\nMaturing monocytes (CD14+/CD64+/CD11b+) 19% Expanded; left-shifted\nPromonocytes / immature monocytic (CD64+, CD14-dim/var, HLA-DR+) 11% Counted with monocytic series\nMaturing granulocytes 28% Decreased, left-shifted\nErythroid precursors (CD71+/CD235a+) 9% Decreased\nMature lymphocytes (T/B/NK) 8% Polytypic, no aberrancy\nOther / unclassified 3% --\nBLAST GATE IMMUNOPHENOTYPE\nMarker Result Marker Result\nCD34 Positive (subset, ~60%) CD64 Positive\nCD117 Positive CD4 Positive (dim)\nHLA-DR Positive (bright) CD11b Partial / variable\nCD13 Positive CD14 Negative on blasts\nCD33 Positive (bright) CD56 Positive (partial, aberrant)\nCD38 Positive CD7 Positive (aberrant, subset)\nMPO (cyto) Positive, dim subset CD2 / CD19 / cyCD3 Negative\nMONOCYTIC POPULATION IMMUNOPHENOTYPE\nMarker Result Marker Result\nCD14 Positive (maturing fraction) HLA-DR Positive\nCD64 Positive (bright, uniform) CD4 Positive (dim)\nCD11b Positive CD13 / CD33 Positive\nCD11c Positive CD34 Negative\nCD36 Positive CD56 Partial (subset)\nINTERPRETATION\nFlow cytometry demonstrates an abnormal myeloid blast population comprising approximately 22% of total nucleated cells, expressing\nCD34, CD117, HLA-DR, CD13, CD33, and dim cytoplasmic MPO, with aberrant CD56 and partial CD7. In addition, there is a markedly\nexpanded and left-shifted monocytic compartment (maturing monocytes plus promonocytes together approximately 30% of total\nnucleated cells) with bright uniform CD64, CD14 on the maturing fraction, CD11b, CD11c, CD36, HLA-DR, and dim CD4.\n\n=== PAGE 2 ===\n\nThe combined findings are diagnostic of acute myeloid leukemia with monocytic differentiation. The immunophenotype\nestablishes the monocytic lineage that was only favored on morphology. Note that the flow blast estimate (22%) differs modestly from\nthe manual aspirate differential; flow gating and manual counts are expected to differ and either value supports the diagnosis in this\ncontext. Aberrant CD56/CD7 expression is noted and may be useful for measurable residual disease tracking. Correlation with\ncytogenetic and molecular studies is required for final classification and is recommended.\nElectronically verified by Priya N. Raghavan, MD, Director of Flow Cytometry, 2026-04-23 14:08. Flow cytometry is a component study within a combined diagnostic\nworkup; final lineage and classification require integration with morphology, cytogenetics, and molecular results. Method: laboratory-developed test, performance\ncharacteristics established by Riverbend Regional Medical Center.\nAccession FC-26-003942 | MRN-4471902 | Page 1 of 1", "CYTO": "\n=== PAGE 1 ===\n\nRiverbend Regional Medical Center\nCYTOGENETICS LABORATORY \u2014 Department of Pathology & Laboratory Medicine\n1200 Halsted Avenue, Lakeshore, IL 60000 | CLIA 14D9999999\nCHROMOSOME ANALYSIS & FISH \u2014 HEMATOLOGIC MALIGNANCY PANEL\nPatient: DOE, JONATHAN R. MRN: MRN-4471902 Accession: CG-26-00871\nDOB: 1967-09-14 (58 y / Male) Collected: 2026-04-22 Reported: 2026-04-29\nSpecimen: Bone marrow aspirate Ordering: A. Patel, MD Status: FINAL\nCLINICAL INDICATION\n58-year-old man with three weeks of progressive fatigue, dyspnea on exertion, gingival bleeding, and scattered lower-extremity\necchymoses. CBC on admission: WBC 38.4 x10^9/L, hemoglobin 7.9 g/dL, platelets 31 x10^9/L. Peripheral smear with 41%\ncirculating blasts, some with folded nuclei and abundant cytoplasm. No prior hematologic history, no prior chemotherapy or\nradiation. Bone marrow performed to evaluate for acute leukemia.\nCONVENTIONAL CHROMOSOME ANALYSIS (G-BANDED)\nTissue cultured Bone marrow, unstimulated\nCultures 24-hour and 48-hour, synchronized\nCells counted 20\nCells karyotyped 5\nBand resolution 400-425 bphs\nISCN RESULT:\n46,XY[20]\nTwenty metaphase cells were analyzed and five were fully karyotyped. All cells showed an apparently normal male chromosome\ncomplement. No clonal numerical or structural abnormality was identified at the stated band resolution. A normal karyotype does\nnot exclude a submicroscopic abnormality; correlation with FISH and molecular studies is advised.\nFLUORESCENCE IN SITU HYBRIDIZATION (FISH)\nInterphase FISH performed on cultured bone marrow using the acute myeloid leukemia panel. 200 interphase nuclei scored per\nprobe.\nProbe / target Abnormality screened Result % nuclei\nRUNX1-RUNX1T1 t(8;21)(q22;q22) NEGATIVE 0.5%\nCBFB inv(16)/t(16;16)(p13;q22) NEGATIVE 1.0%\nPML-RARA t(15;17)(q24;q21) NEGATIVE 0.5%\nKMT2A (MLL) 11q23.3 rearrangement NEGATIVE 1.5%\nMECOM (EVI1) 3q26.2 rearrangement NEGATIVE 1.0%\n-5/5q- (EGR1) deletion 5q31 NEGATIVE 1.5%\n-7/7q- (D7S486) monosomy 7 / del(7q) NEGATIVE 1.0%\nTP53 (17p13.1) deletion 17p NEGATIVE 2.0%\nAll probe signal counts were within the laboratory's established normal cutoff range. No evidence of the targeted rearrangements or copy-number\nabnormalities.\nINTERPRETATION\nNormal male karyotype (46,XY) with a negative AML FISH panel. No recurrent cytogenetic abnormality of acute myeloid leukemia\nwas detected by either method. This places the case in the cytogenetically normal category. Cytogenetically normal AML is\nfrequently driven by gene-level mutations that are not visible by karyotype or FISH; molecular testing (NPM1, FLT3, CEBPA, and a\nbroader myeloid panel) is required for classification and risk stratification and has been ordered separately (see accession\nMMD-26-NGS-22150).\nReviewed and electronically signed by Helena V. Brandt, PhD, FACMG, Director of Cytogenetics, 2026-04-29. This is one component of a combined\nhematopathology workup and should be interpreted together with the morphology, flow cytometry, and molecular reports.\nAccession CG-26-00871 | MRN-4471902 | Page 1 of 1", "MOLEC": "\n=== PAGE 1 ===\n\nMeridian Molecular CAP-accredited / CLIA-certified reference laboratory\n85 Industrial Parkway, Suite 300, Brentwood, IL 60000\nDiagnostics\nCLIA 14D8888888 (cid:127) Lab Director: Okafor, Daniel U., MD, PhD\nMYELOID NEOPLASM NEXT-GENERATION SEQUENCING PANEL (54-GENE) \u2014 FINAL REPORT\nPATIENT SPECIMEN REQUESTED BY\nDOE, JONATHAN R. Reference accession MMD-26-NGS-22150 Riverbend Regional Medical Center\nMRN MRN-4471902 | DOB 1967-09-14 Client accession S26-BM-01187 A. Patel, MD\n58 y / Male Bone marrow aspirate, EDTA Received 2026-04-25\nCollected 2026-04-22 Reported 2026-05-04\nCLINICAL HISTORY (PROVIDED BY ORDERING SITE)\n58-year-old man with three weeks of progressive fatigue, dyspnea on exertion, gingival bleeding, and scattered lower-extremity\necchymoses. CBC on admission: WBC 38.4 x10^9/L, hemoglobin 7.9 g/dL, platelets 31 x10^9/L. Peripheral smear with 41% circulating\nblasts, some with folded nuclei and abundant cytoplasm. No prior hematologic history, no prior chemotherapy or radiation. Bone marrow\nperformed to evaluate for acute leukemia.\nRESULT SUMMARY\nPOSITIVE \u2014 Clinically significant variants detected. NPM1 (Tier I), FLT3 internal tandem duplication (Tier I), and DNMT3A (Tier II)\nidentified. See variant table and interpretation.\nDETECTED VARIANTS\nGene Variant (HGVS) Consequence VAF Tier\nNPM1 NM_002520.7:c.860_863dup Frameshift insertion (type A, 39% I\np.(Trp288CysfsTer12) 4-bp TCTG duplication)\nFLT3 Internal tandem duplication, In-frame ITD; 31% I\nexon 14 (~36 bp insertion) ITD/WT allelic ratio 0.62\nDNMT3A NM_022552.5:c.2645G>A Missense, R882 hotspot 44% II\np.(Arg882His)\nTier I: variants of strong clinical significance. Tier II: variants of potential clinical significance. VAF = variant allele frequency. FLT3-ITD allelic ratio estimated by fragment\nanalysis run in parallel.\nSELECTED GENES WITH NO REPORTABLE VARIANT\nNo reportable variant detected in: CEBPA, RUNX1, TP53, ASXL1, IDH1, IDH2, NRAS, KRAS, KIT, TET2, SRSF2, U2AF1, SF3B1,\nEZH2, BCOR, STAG2, PTPN11, WT1, PHF6, ZRSR2, JAK2, CALR, MPL, SETBP1, CSF3R, NF1, RAD21, GATA2, ETV6, CBL. (Full\n54-gene list and coverage metrics in appendix retained by the laboratory.)\nINTERPRETATION\nThis myeloid NGS panel identifies a mutated NPM1 variant (type A frameshift insertion, VAF 39%) together with a FLT3 internal\ntandem duplication (VAF 31%, ITD/WT allelic ratio 0.62) and a DNMT3A R882H missense variant (VAF 44%). In the context of an\nacute myeloid leukemia established by the morphology and flow cytometry studies, mutated NPM1 is a World Health Organization and\nICC disease-defining genetic abnormality; the diagnosis is therefore acute myeloid leukemia with mutated NPM1, and a blast\nthreshold of 20% is not required for this entity. The concurrent FLT3-ITD is prognostically adverse and is a target for FLT3 inhibitor\ntherapy; the allelic ratio is reported to support treatment decisions. The DNMT3A R882H variant is commonly co-mutated with NPM1\nand FLT3-ITD and is frequently a clonal hematopoiesis founder event; it does not by itself define or change the WHO/ICC disease\ncategory, and is reported here for completeness and potential prognostic relevance. Correlation with morphology, flow cytometry, and\ncytogenetics is recommended; this report is one component of the integrated diagnostic workup.\nMETHODOLOGY & LIMITATIONS\nHybrid-capture targeted NGS of 54 myeloid-associated genes performed on genomic DNA from bone marrow. Mean target coverage 1,150x; minimum 250x. Analytical\nsensitivity approximately 5% VAF for single-nucleotide variants and small indels; FLT3-ITD detection supplemented by capillary fragment analysis. The assay does not\nreliably detect large structural rearrangements, copy-number changes, or variants in regions of low coverage or high homology. A negative result does not exclude a\nmutation below the limit of detection. This laboratory-developed test was validated by Meridian Molecular Diagnostics; it has not been cleared or approved by the FDA.\nElectronically signed: Okafor, Daniel U., MD, PhD, Laboratory Director, and Lucia M. Fernandez, PhD, Variant Scientist \u2014 2026-05-04. Results released to ordering\ninstitution for integration into the combined hematopathology report.\nReference accession MMD-26-NGS-22150 | Client S26-BM-01187 | MRN-4471902 | Page 1 of 1"}, "verified": 61, "total_quotes": 61, "cross": {"concordances": [{"statement": "The process is acute myeloid leukemia: morphology diagnoses AML, flow cytometry calls the findings diagnostic of AML, and the NGS report diagnoses AML with mutated NPM1 on the basis of AML established by morphology and flow.", "supporting_source_ids": ["MORPH", "FLOW", "MOLEC"]}, {"statement": "The leukemia shows monocytic differentiation: morphology and cytochemistry (folded nuclei, NSE positivity with partial fluoride inhibition) favor it, and flow confirms an expanded, left-shifted monocytic compartment (about 30% of TNC) with CD64, CD14, CD11b, CD11c, CD36 and dim CD4.", "supporting_source_ids": ["MORPH", "FLOW"]}, {"statement": "Myeloid lineage of the blasts is supported by MPO expression: cytochemical MPO is positive in a minor subset (about 5-10%) and flow shows dim cytoplasmic MPO with CD13, CD33 and CD117.", "supporting_source_ids": ["MORPH", "FLOW"]}, {"statement": "The marrow blast burden lies close to 20% of nucleated cells (18% by manual aspirate differential, about 22% by flow gating), against a background of extensive marrow replacement and 41% peripheral blood blasts.", "supporting_source_ids": ["MORPH", "FLOW"]}, {"statement": "No TP53 abnormality was found: FISH is negative for a 17p13.1 deletion, and NGS detects no reportable TP53 variant.", "supporting_source_ids": ["CYTO", "MOLEC"]}, {"statement": "Each component report says it does not stand alone and that final classification requires integration with the other studies, and morphology, flow and cytogenetics each name the pending molecular results as necessary.", "supporting_source_ids": ["MORPH", "FLOW", "CYTO", "MOLEC"]}], "discordances": [{"topic": "Marrow blast percentage relative to the 20% threshold", "positions": [{"source_id": "MORPH", "position": "18% blasts by 500-cell aspirate differential, below the historical 20% threshold; promonocytes (4%) were counted separately, and the count is likely depressed by hemodilution."}, {"source_id": "FLOW", "position": "Abnormal myeloid blasts are about 22% of total nucleated cells by CD45/SSC gating; the report says this differs modestly from the manual count and that either value supports the diagnosis."}, {"source_id": "MOLEC", "position": "Mutated NPM1 is disease-defining, so a 20% blast threshold is not required for this entity."}], "resolution": "The difference does not affect classification. AML with mutated NPM1 is defined by the genetic abnormality, not by reaching 20% blasts. The true blast-equivalent burden is probably at or above 20%: counting the 4% promonocytes as blast equivalents gives 22%, which matches flow, and the core shows extensive blast-equivalent infiltration with 41% circulating blasts.", "resolution_basis": "Classification rule: NPM1-mutated AML needs no 20% blast threshold. A manual count and a gated count are expected to differ, and the aspirate count is lowered by hemodilution and by subjective promonocyte assignment.", "changes_diagnosis": false}, {"topic": "Certainty of monocytic lineage", "positions": [{"source_id": "MORPH", "position": "Monocytic differentiation is only probable; promonocytes are hard to separate from immature myeloid forms, and confirmation by flow is required."}, {"source_id": "FLOW", "position": "The immunophenotype establishes the monocytic lineage that morphology only favored."}], "resolution": "Monocytic differentiation is confirmed. The flow immunophenotype (bright uniform CD64, CD14 on maturing cells, CD11b, CD11c, CD36, dim CD4) resolves the uncertainty that morphology raised.", "resolution_basis": "Methodological: multiparameter immunophenotyping assigns lineage more objectively than smear morphology, and the morphology report itself deferred to flow for confirmation.", "changes_diagnosis": false}, {"topic": "Presence of a classifying genetic abnormality", "positions": [{"source_id": "CYTO", "position": "Normal male karyotype 46,XY[20] and a negative AML FISH panel: cytogenetically normal, with no recurrent cytogenetic abnormality of AML detected."}, {"source_id": "MOLEC", "position": "Positive for NPM1 type A frameshift (Tier I, disease-defining), FLT3-ITD (Tier I) and DNMT3A R882H (Tier II)."}], "resolution": "This is only an apparent conflict. The NPM1, FLT3-ITD and DNMT3A variants are small sequence-level changes that karyotyping and FISH cannot see. The case is cytogenetically normal AML with mutated NPM1.", "resolution_basis": "Methodological scope: karyotype and FISH detect only large structural or numerical changes. The cytogenetics report itself states that a normal karyotype does not exclude a submicroscopic abnormality and that molecular testing is needed for classification.", "changes_diagnosis": false}], "single_source_findings": [{"finding": "NPM1 type A frameshift insertion c.860_863dup p.(Trp288CysfsTer12), VAF 39%, Tier I, disease-defining.", "only_source_id": "MOLEC", "invisible_to": ["MORPH", "FLOW", "CYTO"], "diagnostic_impact": "It assigns the case to AML with mutated NPM1 and makes the 18% versus 22% blast-threshold question irrelevant to classification."}, {"finding": "FLT3 internal tandem duplication, exon 14 (about 36 bp), VAF 31%, ITD/WT allelic ratio 0.62, Tier I.", "only_source_id": "MOLEC", "invisible_to": ["MORPH", "FLOW", "CYTO"], "diagnostic_impact": "It does not change the disease category, but it is prognostically adverse and makes the patient a candidate for FLT3 inhibitor therapy."}, {"finding": "DNMT3A R882H missense variant, VAF 44%, Tier II.", "only_source_id": "MOLEC", "invisible_to": ["MORPH", "FLOW", "CYTO"], "diagnostic_impact": "It does not define or change the WHO/ICC category; it is reported as a likely clonal hematopoiesis founder event with possible prognostic relevance."}, {"finding": "Normal karyotype 46,XY[20] with a negative FISH panel for RUNX1-RUNX1T1, CBFB, PML-RARA, KMT2A, MECOM, -5/5q-, -7/7q- and TP53 deletion.", "only_source_id": "CYTO", "invisible_to": ["MORPH", "FLOW", "MOLEC"], "diagnostic_impact": "It excludes the competing recurrent-rearrangement and cytogenetic-risk categories of AML, leaving NPM1 as the single classifying abnormality."}, {"finding": "Aberrant CD56 (partial) and CD7 (subset) expression on blasts.", "only_source_id": "FLOW", "invisible_to": ["MORPH", "CYTO", "MOLEC"], "diagnostic_impact": "It does not change the diagnosis, but it gives a leukemia-associated immunophenotype for tracking measurable residual disease."}]}, "parsers": {"morph": "Bone marrow aspirate and core biopsy (left posterior iliac crest) from a 58-year-old man with 41% circulating peripheral blood blasts show a markedly hypercellular marrow (approximately 90-95%) with extensive replacement by sheets of immature mononuclear cells and extensive blast-equivalent infiltration on the core; the 500-cell aspirate differential gives 18% blasts, with promonocytes (4%) enumerated separately. Blasts are medium-to-large with fine chromatin and one to three nucleoli, and a subset shows slightly folded or indented nuclei with grayish cytoplasm and occasional fine azurophilic granulation; no definite Auer rods are identified after review of multiple smears. Background erythropoiesis is left-shifted with mild megaloblastoid change, megakaryocytes are reduced, reticulin shows no significant fibrosis (MF-1), and storage iron is present without ring sideroblasts. Cytochemically, MPO is positive in only a minor subset of blasts (approximately 5-10%) and NSE is positive in a subset of cells with partial fluoride inhibition, a combined pattern the report reads as consistent with a myeloid process with probable monocytic differentiation, to be confirmed by flow cytometry. The report states that the 18% aspirate blast count is below the historical 20% threshold, that enumeration is likely affected by hemodilution and by the difficulty of separating promonocytes from myeloid blasts on smears, and that promonocyte assignment is morphologically subjective. It further states that monocytic lineage is probable only and that classification depends on flow cytometry, cytogenetic, and molecular results that were pending at the time of the report.", "flow": "Flow cytometry of the bone marrow aspirate (eight-color panel, CD45 vs side scatter gating; viability 94% by 7-AAD) identifies an abnormal myeloid blast population of approximately 22% of total nucleated cells, alongside a markedly expanded, left-shifted monocytic compartment of maturing monocytes 19% plus promonocytes/immature monocytic cells 11% (together approximately 30% of TNC). The blasts express CD34 (subset, ~60%), CD117, HLA-DR (bright), CD13, CD33 (bright), CD38, CD64, dim CD4 and dim cytoplasmic MPO, are CD14 negative, and are negative for CD2, CD19 and cyCD3; the monocytic population shows bright uniform CD64, CD14 on the maturing fraction, CD11b, CD11c, CD36, HLA-DR and dim CD4. The report states that this immunophenotype establishes the monocytic lineage that was only favored on morphology, resolving that lineage hedge, with no lymphoid lineage markers (CD2, CD19, cyCD3) expressed. Aberrant antigen expression is present on the blasts, with CD56 (partial) and CD7 (subset), which the report notes may be useful for measurable residual disease tracking. As limitations, the report notes that the flow blast estimate (22%) differs modestly from the manual aspirate differential (flow gating and manual counts are expected to differ, and either value is stated to support the diagnosis), that the assay is a laboratory-developed test, and that correlation with cytogenetic and molecular studies is required for final classification.", "cyto": "G-banded chromosome analysis of the unstimulated bone marrow aspirate (24- and 48-hour synchronized cultures, 400-425 bphs) showed a normal male karyotype, reported verbatim as \"46,XY[20],\" with \"No clonal numerical or structural abnormality was identified at the stated band resolution.\" Interphase FISH with the AML panel (200 nuclei scored per probe) was negative for every probe tested: RUNX1-RUNX1T1 t(8;21)(q22;q22) (0.5%), CBFB inv(16)/t(16;16)(p13;q22) (1.0%), PML-RARA t(15;17)(q24;q21) (0.5%), KMT2A (MLL) 11q23.3 rearrangement (1.5%), MECOM (EVI1) 3q26.2 rearrangement (1.0%), -5/5q- (EGR1) deletion 5q31 (1.5%), -7/7q- (D7S486) monosomy 7/del(7q) (1.0%), and TP53 (17p13.1) deletion 17p (2.0%), with all signal counts within the laboratory's normal cutoff range. No classifying recurrent cytogenetic abnormality was detected, and the report states that \"This places the case in the cytogenetically normal category,\" which is itself a relevant finding for WHO 5e classification. The report states these limitations: \"A normal karyotype does not exclude a submicroscopic abnormality\"; results apply only at the stated band resolution with 20 cells counted and 5 fully karyotyped; and molecular testing (NPM1, FLT3, CEBPA, and a broader myeloid panel) \"is required for classification and risk stratification\" and has been ordered separately (accession MMD-26-NGS-22150)."}, "molsplit": {"summary": "Hybrid-capture 54-gene myeloid NGS panel on bone marrow aspirate reported as POSITIVE for clinically significant variants: NPM1 type A frameshift insertion (c.860_863dup, VAF 39%, Tier I), FLT3 internal tandem duplication in exon 14 (~36 bp, VAF 31%, ITD/WT allelic ratio 0.62, Tier I), and DNMT3A R882H missense (c.2645G>A, VAF 44%, Tier II). No reportable variant was detected in the listed selected genes including CEBPA, RUNX1, TP53, ASXL1, IDH1, IDH2, and others. The interpretation states that, in the context of an AML established by morphology and flow cytometry, mutated NPM1 is a WHO and ICC disease-defining abnormality and the diagnosis is therefore acute myeloid leukemia with mutated NPM1, with no 20% blast threshold required. FLT3-ITD is described as prognostically adverse and a therapeutic target; DNMT3A R882H is described as not by itself defining or changing the WHO/ICC category. Correlation with morphology, flow cytometry, and cytogenetics is recommended.", "classifying_variants": [{"gene": "NPM1", "variant": "NM_002520.7:c.860_863dup p.(Trp288CysfsTer12)", "vaf": "39%", "tier": "
