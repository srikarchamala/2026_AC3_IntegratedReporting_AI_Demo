I", "classifying": true, "prognostic_note": "Reported as a WHO and ICC disease-defining genetic abnormality (AML with mutated NPM1); no separate prognostic statement given in the report.", "verbatim_support": "mutated NPM1 is a World Health Organization and ICC disease-defining genetic abnormality"}], "prognostic_variants": [{"gene": "FLT3", "variant": "Internal tandem duplication, exon 14 (~36 bp insertion)", "vaf": "31%", "tier": "I", "classifying": false, "prognostic_note": "Prognostically adverse and a target for FLT3 inhibitor therapy; ITD/WT allelic ratio 0.62 reported to support treatment decisions.", "verbatim_support": "The concurrent FLT3-ITD is prognostically adverse and is a target for FLT3 inhibitor therapy"}, {"gene": "DNMT3A", "variant": "NM_022552.5:c.2645G>A p.(Arg882His)", "vaf": "44%", "tier": "II", "classifying": false, "prognostic_note": "Commonly co-mutated with NPM1 and FLT3-ITD; frequently a clonal hematopoiesis founder event; reported for completeness and potential prognostic relevance.", "verbatim_support": "it does not by itself define or change the WHO/ICC disease category"}]}, "who": {"integrated_report": {"patient_specimen_id": "Case case_aml: bone marrow aspirate and core biopsy (left posterior iliac crest) from a 58-year-old man, studied by morphology, flow cytometry, cytogenetics/FISH and a myeloid NGS panel.", "component_studies": [{"source_id": "MORPH", "lab": "Not provided", "accession": "Not provided", "report_date": "Not provided"}, {"source_id": "FLOW", "lab": "Not provided", "accession": "Not provided", "report_date": "Not provided"}, {"source_id": "CYTO", "lab": "Not provided", "accession": "Not provided", "report_date": "Not provided"}, {"source_id": "MOLEC", "lab": "Not provided", "accession": "MMD-26-NGS-22150 (as referenced in the cytogenetics report)", "report_date": "Not provided"}], "clinical_context": "58-year-old man with 41% circulating peripheral blood blasts, undergoing bone marrow evaluation (aspirate and core biopsy, left posterior iliac crest) for suspected acute leukemia.", "morphology_summary": "The marrow is markedly hypercellular (approximately 90-95%) with extensive replacement by sheets of immature mononuclear cells and extensive blast-equivalent infiltration on the core. The 500-cell aspirate differential gives 18% blasts, with promonocytes (4%) enumerated separately. Blasts are medium-to-large with fine chromatin and one to three nucleoli; a subset has folded or indented nuclei with grayish cytoplasm and occasional fine azurophilic granulation; no definite Auer rods are seen. Erythropoiesis is left-shifted with mild megaloblastoid change, megakaryocytes are reduced, reticulin is MF-1, and storage iron is present without ring sideroblasts. Cytochemistry shows MPO positivity in a minor subset of blasts (approximately 5-10%) and NSE positivity with partial fluoride inhibition, read as a myeloid process with probable monocytic differentiation. The report notes that the blast count is likely depressed by hemodilution and by the subjectivity of promonocyte assignment, and deferred lineage confirmation and classification to flow, cytogenetic and molecular studies.", "flow_or_ihc_summary": "Eight-color flow cytometry (CD45/SSC gating; viability 94% by 7-AAD) identifies abnormal myeloid blasts at approximately 22% of total nucleated cells, expressing CD34 (subset, ~60%), CD117, bright HLA-DR, CD13, bright CD33, CD38, CD64, dim CD4 and dim cytoplasmic MPO, and negative for CD14, CD2, CD19 and cyCD3. A markedly expanded, left-shifted monocytic compartment (maturing monocytes 19% plus promonocytes/immature monocytic cells 11%, approximately 30% of TNC) shows bright uniform CD64, CD14 on the maturing fraction, CD11b, CD11c, CD36, HLA-DR and dim CD4, establishing monocytic lineage. Aberrant CD56 (partial) and CD7 (subset) are expressed on the blasts and may be used for measurable residual disease tracking. The assay is a laboratory-developed test.", "cytogenetics_summary": "G-banded karyotype (24- and 48-hour synchronized cultures, 400-425 bphs): 46,XY[20], with no clonal numerical or structural abnormality at the stated band resolution. Interphase AML FISH panel (200 nuclei per probe) is negative for RUNX1-RUNX1T1, CBFB rearrangement, PML-RARA, KMT2A rearrangement, MECOM rearrangement, -5/5q- (EGR1), -7/7q- (D7S486) and TP53 (17p13.1) deletion, all within normal cutoffs. The case is cytogenetically normal.", "molecular_summary": "Hybrid-capture 54-gene myeloid NGS panel is positive for: NPM1 type A frameshift insertion NM_002520.7:c.860_863dup p.(Trp288CysfsTer12), VAF 39%, Tier I (classifying); FLT3 internal tandem duplication, exon 14 (~36 bp), VAF 31%, ITD/WT allelic ratio 0.62, Tier I (prognostic/predictive, not classifying); and DNMT3A NM_022552.5:c.2645G>A p.(Arg882His), VAF 44%, Tier II (prognostic, not classifying). No reportable variant was detected in the listed selected genes including CEBPA, RUNX1, TP53, ASXL1, IDH1 and IDH2.", "integrated_interpretation": ["The integrated findings establish acute myeloid leukemia: morphology, flow cytometry and the molecular report each support AML in a markedly hypercellular (approximately 90-95%) marrow extensively replaced by immature mononuclear cells, with 41% circulating peripheral blood blasts.", "Myeloid lineage of the blasts is supported by cytochemical MPO positivity in a minor subset (approximately 5-10%) and by flow cytometric dim cytoplasmic MPO with CD13, CD33 and CD117, with no lymphoid lineage markers (CD2, CD19, cyCD3) expressed.", "The marrow blast percentage is discordant between the 500-cell aspirate differential (18%, with promonocytes 4% counted separately) and flow cytometry (approximately 22% of total nucleated cells by CD45/side-scatter gating).", "This discordance does not affect classification, because under the WHO Instructions AML with NPM1 mutation is defined by the genetic abnormality regardless of the morphologic blast count, so the historical 20% threshold does not apply.", "The true blast-equivalent burden is probably at or above 20%: counting the 4% promonocytes as blast equivalents gives 22%, matching flow, the core shows extensive blast-equivalent infiltration, and the aspirate count is likely lowered by hemodilution and by subjective promonocyte assignment.", "Morphology regarded monocytic differentiation as probable only (folded or indented nuclei, NSE positivity with partial fluoride inhibition), whereas flow cytometry states that the immunophenotype establishes the monocytic lineage.", "This discordance is resolved as confirmed monocytic differentiation, because multiparameter immunophenotyping (bright uniform CD64, CD14 on maturing cells, CD11b, CD11c, CD36 and dim CD4 in an expanded monocytic compartment of about 30% of TNC) assigns lineage more objectively than smear morphology, and the morphology report itself deferred to flow for confirmation.", "Cytogenetics reports a normal male karyotype, 46,XY[20], with a negative AML FISH panel, whereas the NGS panel is positive for an NPM1 type A frameshift, FLT3-ITD and DNMT3A R882H.", "This is only an apparent conflict: these are small sequence-level variants that karyotyping and FISH cannot detect, as the cytogenetics report itself acknowledges in stating that a normal karyotype does not exclude a submicroscopic abnormality, so the case is cytogenetically normal AML with mutated NPM1.", "The NPM1 type A frameshift insertion (c.860_863dup, VAF 39%, Tier I) was detectable only on the molecular (NGS) study and was invisible to morphology, flow cytometry and cytogenetics; it is the finding that assigns the case to AML with NPM1 mutation and makes the 18% versus 22% blast-threshold question irrelevant to classification.", "FLT3-ITD (exon 14, about 36 bp, VAF 31%, ITD/WT allelic ratio 0.62, Tier I) was likewise detected only by NGS and was invisible to the other three studies; it does not change the disease category but is prognostically adverse and makes the patient a candidate for FLT3 inhibitor therapy.", "DNMT3A R882H (VAF 44%, Tier II) was also detected only by NGS and was invisible to the other three studies; it does not define or change the WHO/ICC category and is reported as a likely clonal hematopoiesis founder event with possible prognostic relevance.", "The normal karyotype and negative FISH panel (RUNX1-RUNX1T1, CBFB, PML-RARA, KMT2A, MECOM, -5/5q-, -7/7q- and TP53 deletion) were established only by cytogenetics and exclude the competing recurrent-rearrangement and cytogenetic-risk categories of AML, leaving NPM1 as the single classifying abnormality.", "Aberrant CD56 (partial) and CD7 (subset) expression on the blasts was detected only by flow cytometry and was invisible to the other studies; it does not change the diagnosis but provides a leukemia-associated immunophenotype for measurable residual disease tracking.", "No TP53 abnormality was identified, with FISH negative for a 17p13.1 deletion and NGS detecting no reportable TP53 variant.", "Under the WHO Instructions, FLT3-ITD and DNMT3A are prognostic rather than classifying mutations, so the entity is named by the NPM1 mutation alone and not by differentiation under the AML-NOS scheme."], "final_integrated_diagnosis": ["Bone marrow, left posterior iliac crest, aspirate and core biopsy: Acute myeloid leukemia with NPM1 mutation (WHO 5e), with monocytic differentiation.", "Cytogenetically normal karyotype (46,XY[20]) with a negative AML FISH panel.", "Marrow blasts 18% by manual aspirate differential (22% when the 4% promonocytes are counted as blast equivalents) and approximately 22% by flow cytometry; the 20% blast threshold does not apply to this genetically defined entity."], "prognostic_predictive_notes": "FLT3-ITD (exon 14, ~36 bp, VAF 31%, ITD/WT allelic ratio 0.62, Tier I) is reported as prognostically adverse and as a target for FLT3 inhibitor therapy; the allelic ratio is provided to support treatment decisions. DNMT3A R882H (VAF 44%, Tier II) is commonly co-mutated with NPM1 and FLT3-ITD, is frequently a clonal hematopoiesis founder event, and is reported for completeness and potential prognostic relevance; per the WHO Instructions, the co-occurrence of DNMT3A with NPM1 and FLT3-ITD is prognostically relevant. Neither FLT3-ITD nor DNMT3A defines or changes the disease category. No TP53 abnormality was detected by FISH or NGS. Aberrant CD56 (partial) and CD7 (subset) on blasts provide a leukemia-associated immunophenotype for measurable residual disease monitoring.", "limitations_pending": "Morphology: the 18% aspirate blast count is likely affected by hemodilution, promonocyte assignment on smears is subjective, and no definite Auer rods were identified. Flow cytometry: the assay is a laboratory-developed test, and the gated blast estimate (22%) is expected to differ from the manual count. Cytogenetics: results apply only at the stated band resolution (400-425 bphs) with 20 cells counted and 5 fully karyotyped, and a normal karyotype does not exclude a submicroscopic abnormality. Molecular: negative results are stated for the listed selected genes (including CEBPA, RUNX1, TP53, ASXL1, IDH1 and IDH2); the complete 54-gene list was not provided in the synthesis. Component laboratory names, most accession numbers and report dates were not provided to the integrator."}, "evidence_trace": [{"section": "integrated_interpretation", "sentence_number": 1, "sentence": "The integrated findings establish acute myeloid leukemia: morphology, flow cytometry and the molecular report each support AML in a markedly hypercellular (approximately 90-95%) marrow extensively replaced by immature mononuclear cells, with 41% circulating peripheral blood blasts.", "supporting_source_ids": ["MORPH", "FLOW", "MOLEC"], "basis": "concordance"}, {"section": "integrated_interpretation", "sentence_number": 2, "sentence": "Myeloid lineage of the blasts is supported by cytochemical MPO positivity in a minor subset (approximately 5-10%) and by flow cytometric dim cytoplasmic MPO with CD13, CD33 and CD117, with no lymphoid lineage markers (CD2, CD19, cyCD3) expressed.", "supporting_source_ids": ["MORPH", "FLOW"], "basis": "concordance"}, {"section": "integrated_interpretation", "sentence_number": 3, "sentence": "The marrow blast percentage is discordant between the 500-cell aspirate differential (18%, with promonocytes 4% counted separately) and flow cytometry (approximately 22% of total nucleated cells by CD45/side-scatter gating).", "supporting_source_ids": ["MORPH", "FLOW"], "basis": "discordance_resolution"}, {"section": "integrated_interpretation", "sentence_number": 4, "sentence": "This discordance does not affect classification, because under the WHO Instructions AML with NPM1 mutation is defined by the genetic abnormality regardless of the morphologic blast count, so the historical 20% threshold does not apply.", "supporting_source_ids": ["MORPH", "FLOW", "MOLEC"], "basis": "discordance_resolution"}, {"section": "integrated_interpretation", "sentence_number": 5, "sentence": "The true blast-equivalent burden is probably at or above 20%: counting the 4% promonocytes as blast equivalents gives 22%, matching flow, the core shows extensive blast-equivalent infiltration, and the aspirate count is likely lowered by hemodilution and by subjective promonocyte assignment.", "supporting_source_ids": ["MORPH", "FLOW"], "basis": "discordance_resolution"}, {"section": "integrated_interpretation", "sentence_number": 6, "sentence": "Morphology regarded monocytic differentiation as probable only (folded or indented nuclei, NSE positivity with partial fluoride inhibition), whereas flow cytometry states that the immunophenotype establishes the monocytic lineage.", "supporting_source_ids": ["MORPH", "FLOW"], "basis": "discordance_resolution"}, {"section": "integrated_interpretation", "sentence_number": 7, "sentence": "This discordance is resolved as confirmed monocytic differentiation, because multiparameter immunophenotyping (bright uniform CD64, CD14 on maturing cells, CD11b, CD11c, CD36 and dim CD4 in an expanded monocytic compartment of about 30% of TNC) assigns lineage more objectively than smear morphology, and the morphology report itself deferred to flow for confirmation.", "supporting_source_ids": ["MORPH", "FLOW"], "basis": "discordance_resolution"}, {"section": "integrated_interpretation", "sentence_number": 8, "sentence": "Cytogenetics reports a normal male karyotype, 46,XY[20], with a negative AML FISH panel, whereas the NGS panel is positive for an NPM1 type A frameshift, FLT3-ITD and DNMT3A R882H.", "supporting_source_ids": ["CYTO", "MOLEC"], "basis": "discordance_resolution"}, {"section": "integrated_interpretation", "sentence_number": 9, "sentence": "This is only an apparent conflict: these are small sequence-level variants that karyotyping and FISH cannot detect, as the cytogenetics report itself acknowledges in stating that a normal karyotype does not exclude a submicroscopic abnormality, so the case is cytogenetically normal AML with mutated NPM1.", "supporting_source_ids": ["CYTO", "MOLEC"], "basis": "discordance_resolution"}, {"section": "integrated_interpretation", "sentence_number": 10, "sentence": "The NPM1 type A frameshift insertion (c.860_863dup, VAF 39%, Tier I) was detectable only on the molecular (NGS) study and was invisible to morphology, flow cytometry and cytogenetics; it is the finding that assigns the case to AML with NPM1 mutation and makes the 18% versus 22% blast-threshold question irrelevant to classification.", "supporting_source_ids": ["MOLEC"], "basis": "single_source_finding"}, {"section": "integrated_interpretation", "sentence_number": 11, "sentence": "FLT3-ITD (exon 14, about 36 bp, VAF 31%, ITD/WT allelic ratio 0.62, Tier I) was likewise detected only by NGS and was invisible to the other three studies; it does not change the disease category but is prognostically adverse and makes the patient a candidate for FLT3 inhibitor therapy.", "supporting_source_ids": ["MOLEC"], "basis": "single_source_finding"}, {"section": "integrated_interpretation", "sentence_number": 12, "sentence": "DNMT3A R882H (VAF 44%, Tier II) was also detected only by NGS and was invisible to the other three studies; it does not define or change the WHO/ICC category and is reported as a likely clonal hematopoiesis founder event with possible prognostic relevance.", "supporting_source_ids": ["MOLEC"], "basis": "single_source_finding"}, {"section": "integrated_interpretation", "sentence_number": 13, "sentence": "The normal karyotype and negative FISH panel (RUNX1-RUNX1T1, CBFB, PML-RARA, KMT2A, MECOM, -5/5q-, -7/7q- and TP53 deletion) were established only by cytogenetics and exclude the competing recurrent-rearrangement and cytogenetic-risk categories of AML, leaving NPM1 as the single classifying abnormality.", "supporting_source_ids": ["CYTO"], "basis": "single_source_finding"}, {"section": "integrated_interpretation", "sentence_number": 14, "sentence": "Aberrant CD56 (partial) and CD7 (subset) expression on the blasts was detected only by flow cytometry and was invisible to the other studies; it does not change the diagnosis but provides a leukemia-associated immunophenotype for measurable residual disease tracking.", "supporting_source_ids": ["FLOW"], "basis": "single_source_finding"}, {"section": "integrated_interpretation", "sentence_number": 15, "sentence": "No TP53 abnormality was identified, with FISH negative for a 17p13.1 deletion and NGS detecting no reportable TP53 variant.", "supporting_source_ids": ["CYTO", "MOLEC"], "basis": "concordance"}, {"section": "integrated_interpretation", "sentence_number": 16, "sentence": "Under the WHO Instructions, FLT3-ITD and DNMT3A are prognostic rather than classifying mutations, so the entity is named by the NPM1 mutation alone and not by differentiation under the AML-NOS scheme.", "supporting_source_ids": ["MOLEC"], "basis": "classification_rule"}, {"section": "final_integrated_diagnosis", "sentence_number": 1, "sentence": "Bone marrow, left posterior iliac crest, aspirate and core biopsy: Acute myeloid leukemia with NPM1 mutation (WHO 5e), with monocytic differentiation.", "supporting_source_ids": ["MORPH", "FLOW", "MOLEC"], "basis": "classification_rule"}, {"section": "final_integrated_diagnosis", "sentence_number": 2, "sentence": "Cytogenetically normal karyotype (46,XY[20]) with a negative AML FISH panel.", "supporting_source_ids": ["CYTO"], "basis": "direct_finding"}, {"section": "final_integrated_diagnosis", "sentence_number": 3, "sentence": "Marrow blasts 18% by manual aspirate differential (22% when the 4% promonocytes are counted as blast equivalents) and approximately 22% by flow cytometry; the 20% blast threshold does not apply to this genetically defined entity.", "supporting_source_ids": ["MORPH", "FLOW", "MOLEC"], "basis": "classification_rule"}]}, "agent_checks": {"npm1_in_dx": true, "dnmt3a_out_of_dx": true, "blast_reconciled": true, "dnmt3a_in_prog": true, "unsupported": 0, "traced": 19, "flt3_in_dx": false}, "qa_det": [], "qa_llm": [{"category": "hidden_discordance", "severity": "medium", "concern": "Sentence 5 says morphology's 22% blast-equivalent count (18% blasts + 4% promonocytes) 'matches flow', but the flow 22% counts only CD34/CD117 myeloid blasts and excludes the separately reported 11% promonocytes/immature monocytic cells, so the two figures are not like-for-like and the 4% vs 11% promonocyte discordance is never acknowledged.", "reference": "integrated_interpretation sentence 5; final_integrated_diagnosis sentence 3"}, {"category": "other", "severity": "medium", "concern": "Sentence 16 says the entity is named by the NPM1 mutation alone and not by differentiation, yet the final diagnosis appends 'with monocytic differentiation' to the WHO 5e name without explaining that this is a descriptive qualifier and not part of the classification.", "reference": "integrated_interpretation sentence 16; final_integrated_diagnosis sentence 1"}, {"category": "overstatement", "severity": "medium", "concern": "FLT3-ITD is presented as prognostically adverse without qualification, but in the NPM1-mutated setting current ELN 2022 risk stratification places NPM1-mut/FLT3-ITD in the intermediate category whatever the allelic ratio, so the claim should be attributed to the source or qualified.", "reference": "integrated_interpretation sentence 11; prognostic_predictive_notes"}, {"category": "overstatement", "severity": "low", "concern": "Sentence 13 says karyotype and a targeted FISH panel 'exclude' the competing recurrent-rearrangement categories, but cryptic fusions not covered by the panel (e.g. NUP98 rearrangements) are not excluded at 400-425 bphs, and the cytogenetics report itself notes that submicroscopic abnormalities are not excluded.", "reference": "integrated_interpretation sentence 13"}, {"category": "trace_basis_mismatch", "severity": "low", "concern": "Sentence 13 is traced as a CYTO-only single_source_finding, but its conclusion ('leaving NPM1 as the single classifying abnormality') relies on the MOLEC result and is an integrative classification inference, not a single-source finding.", "reference": "integrated_interpretation sentence 13"}, {"category": "overstatement", "severity": "low", "concern": "Sentence 11 says FLT3-ITD 'makes the patient a candidate for FLT3 inhibitor therapy', which turns the source's statement that FLT3-ITD is a therapeutic target into a patient-level treatment eligibility judgement that depends on clinical factors outside these reports.", "reference": "integrated_interpretation sentence 11"}, {"category": "trace_basis_mismatch", "severity": "low", "concern": "Sentence 3 only states the blast-count discordance and does not resolve it, so its basis of 'discordance_resolution' does not fit the content; the resolution is in sentences 4-5.", "reference": "integrated_interpretation sentence 3"}], "manual": {"sources": [{"source_id": "MORPH", "report_type": "bone_marrow_morphology", "accession": "S26-BM-01187", "performing_lab": "Riverbend Regional Medical Center, Department of Pathology & Laboratory Medicine (Hematopathology)", "report_date": "2026-04-24", "report_status": "FINAL (morphology component)"}, {"source_id": "FLOW", "report_type": "flow_cytometry", "accession": "FC-26-003942", "performing_lab": "Riverbend Regional Medical Center, Flow Cytometry Laboratory", "report_date": "2026-04-23", "report_status": "FINAL"}, {"source_id": "CYTO", "report_type": "cytogenetics_fish", "accession": "CG-26-00871", "performing_lab": "Riverbend Regional Medical Center, Cytogenetics Laboratory", "report_date": "2026-04-29", "report_status": "FINAL"}, {"source_id": "MOLEC", "report_type": "molecular_ngs", "accession": "MMD-26-NGS-22150", "performing_lab": "Meridian Molecular Diagnostics (reference laboratory, CLIA 14D8888888)", "report_date": "2026-05-04", "report_status": "FINAL"}], "cross": {"concordances": [{"statement": "All four reports share the same patient (DOE, JONATHAN R.), MRN (MRN-4471902), DOB (1967-09-14), and collection date (2026-04-22); the molecular report also cross-references client accession S26-BM-01187 and the cytogenetics report references MMD-26-NGS-22150.", "supporting_source_ids": ["MORPH", "FLOW", "CYTO", "MOLEC"]}, {"statement": "Identical clinical history and CBC (WBC 38.4 x10^9/L, Hb 7.9 g/dL, platelets 31 x10^9/L, 41% peripheral blasts) repeated in all four reports.", "supporting_source_ids": ["MORPH", "FLOW", "CYTO", "MOLEC"]}, {"statement": "Morphology and flow cytometry both identify acute myeloid leukemia with monocytic differentiation (probable on morphology/cytochemistry, established on flow).", "supporting_source_ids": ["MORPH", "FLOW"]}, {"statement": "MPO is expressed in only a subset of blasts by both cytochemistry (approximately 5-10%) and flow (positive, dim subset).", "supporting_source_ids": ["MORPH", "FLOW"]}, {"statement": "Morphology (folded/indented nuclei, monocytoid features, NSE positivity) and flow (expanded monocytic compartment) both support a monocytic component; peripheral blasts with folded nuclei noted in shared history.", "supporting_source_ids": ["MORPH", "FLOW"]}, {"statement": "Morphology and molecular reports both state that under WHO/ICC a 20% blast count is not required when a defining genetic abnormality is present.", "supporting_source_ids": ["MORPH", "MOLEC"]}, {"statement": "Cytogenetics finds no recurrent AML abnormality and no TP53 deletion; molecular finds no TP53, RUNX1, or KIT variant and identifies gene-level drivers, consistent with the cytogenetics report's statement that cytogenetically normal AML is frequently driven by gene-level mutations.", "supporting_source_ids": ["CYTO", "MOLEC"]}, {"statement": "All four reports state that final classification requires integration of the component studies.", "supporting_source_ids": ["MORPH", "FLOW", "CYTO", "MOLEC"]}], "discordances": [{"topic": "Marrow blast percentage", "positions": [{"source_id": "MORPH", "position": "Aspirate blast count 18% by 500-cell manual differential (promonocytes 4% counted separately); core shows extensive blast-equivalent infiltration."}, {"source_id": "FLOW", "position": "Myeloid blasts approximately 22% of total nucleated cells by CD45/SSC gating; promonocytes/immature monocytic 11% counted with monocytic series."}], "resolution": "Both values are recorded as reported; the difference is expected methodological variance and does not need to be forced to a single number at this stage.", "resolution_basis": "Manual smear differentials and gated flow counts are expected to differ (stated by FLOW); MORPH attributes its lower count to hemodilution of the aspirate and difficulty separating promonocytes from myeloid blasts; the core biopsy shows infiltration well above either figure. Both MORPH and MOLEC state that a 20% blast threshold is not required when a defining genetic abnormality is present, and MOLEC reports mutated NPM1, so the 18% vs 22% straddling of 20% is not decisive.", "changes_diagnosis": false}, {"topic": "Lineage certainty (monocytic differentiation)", "positions": [{"source_id": "MORPH", "position": "Probable monocytic differentiation by morphology and cytochemistry; to be confirmed by flow cytometry; promonocytes hard to separate from immature myeloid forms."}, {"source_id": "FLOW", "position": "Diagnostic of AML with monocytic differentiation; immunophenotype establishes the monocytic lineage."}], "resolution": "Not a true conflict: morphology hedges and explicitly defers to flow; flow confirms monocytic lineage.", "resolution_basis": "Immunophenotyping (bright uniform CD64, CD14, CD11b, CD11c, CD36, dim CD4 on an expanded monocytic compartment) is the more specific method for monocytic lineage assignment; MORPH itself states its call is to be confirmed by flow cytometry.", "changes_diagnosis": false}, {"topic": "Aspirate morphologic diagnosis below historical 20% blast threshold vs AML diagnosis", "positions": [{"source_id": "MORPH", "position": "Manual aspirate blast percentage (18%) is below the historical 20% threshold, yet AML is diagnosed with comment."}, {"source_id": "MOLEC", "position": "Mutated NPM1 is a WHO/ICC disease-defining abnormality; a blast threshold of 20% is not required for this entity."}], "resolution": "The apparent tension is resolved by the stated classification rule reported in both MORPH and MOLEC; final classification left to Stage 2.", "resolution_basis": "Classification rule as stated in the source reports: under WHO and ICC, AML with a defining genetic abnormality (mutated NPM1, reported by MOLEC) does not require a 20% blast count.", "changes_diagnosis": false}], "single_source_findings": [{"finding": "NPM1 type A frameshift insertion (c.860_863dup), VAF 39% - the disease-defining genetic abnormality", "only_source_id": "MOLEC", "invisible_to": ["MORPH", "FLOW", "CYTO"], "diagnostic_impact": "Per MOLEC, defines the WHO/ICC disease category and removes the 20% blast requirement, rendering the 18% vs 22% blast discordance non-decisive. Karyotype and FISH were normal, and morphology/flow cannot detect gene-level mutations."}, {"finding": "FLT3 internal tandem duplication, VAF 31%, ITD/WT allelic ratio 0.62", "only_source_id": "MOLEC", "invisible_to": ["MORPH", "FLOW", "CYTO"], "diagnostic_impact": "Does not change disease category but is prognostically adverse and identifies a target for FLT3 inhibitor therapy; directly affects risk stratification and treatment."}, {"finding": "DNMT3A R882H, VAF 44% (possible clonal hematopoiesis founder event)", "only_source_id": "MOLEC", "invisible_to": ["MORPH", "FLOW", "CYTO"], "diagnostic_impact": "Non-classifying; potential prognostic relevance only. Must not drift into the classification."}, {"finding": "Aberrant CD56 (partial) and CD7 (subset) expression on blasts", "only_source_id": "FLOW", "invisible_to": ["MORPH", "CYTO", "MOLEC"], "diagnostic_impact": "No change to diagnosis; provides a leukemia-associated immunophenotype useful for measurable residual disease tracking."}, {"finding": "Normal karyotype 46,XY[20] with negative AML FISH panel (excludes recurrent rearrangements including PML-RARA, RUNX1-RUNX1T1, CBFB, KMT2A, MECOM, and -5/-7/17p loss)", "only_source_id": "CYTO", "invisible_to": ["MORPH", "FLOW", "MOLEC"], "diagnostic_impact": "Excludes competing cytogenetically defined AML entities and adverse-risk cytogenetic lesions; MOLEC states its assay does not reliably detect large structural rearrangements or copy-number changes, so only CYTO can exclude these."}]}, "variants": [{"gene": "NPM1", "hgvs": "NM_002520.7:c.860_863dup p.(Trp288CysfsTer12)", "consequence": "Frameshift insertion (type A, 4-bp TCTG duplication)", "vaf": "39%", "tier": "I", "classifying": true, "prognostic_note": "Report states mutated NPM1 is a WHO and ICC disease-defining genetic abnormality; blast threshold of 20% not required for this entity."}, {"gene": "FLT3", "hgvs": "Internal tandem duplication, exon 14 (~36 bp insertion)", "consequence": "In-frame ITD; ITD/WT allelic ratio 0.62", "vaf": "31%", "tier": "I", "classifying": false, "prognostic_note": "Report states FLT3-ITD is prognostically adverse and a target for FLT3 inhibitor therapy; allelic ratio 0.62 reported to support treatment decisions."}, {"gene": "DNMT3A", "hgvs": "NM_022552.5:c.2645G>A p.(Arg882His)", "consequence": "Missense, R882 hotspot", "vaf": "44%", "tier": "II", "classifying": false, "prognostic_note": "Report states commonly co-mutated with NPM1 and FLT3-ITD, frequently a clonal hematopoiesis founder event; does not by itself define or change the WHO/ICC disease category; reported for completeness and potential prognostic relevance."}], "uncertain": ["case_id not stated in any source report; 'AML-WORKSHOP-CASE-01' taken from the schema example.", "Morphology report shows report date 2026-04-24, while flow (resulted 2026-04-23) was issued before it, yet morphology states ancillary results were pending; recorded dates as printed.", "Morphology monocyte/promonocyte counts (6% mature monocytes, 4% promonocytes) differ from flow (19% maturing monocytes, 11% promonocytes); recorded as-is in components, not reconciled.", "Flow monocytic approx_pct_of_tnc recorded as 30 from the report's 'approximately 30%' (19% + 11%).", "Cytogenetic risk category: the report states only 'cytogenetically normal category' and gives no explicit ELN/risk tier.", "FLT3 has no HGVS string in the report; descriptive ITD text used in hgvs field rather than inventing one.", "PDF text extraction split some table rows (NPM1 and FLT3 rows) across lines; HGVS, consequence, and VAF reassembled by column position.", "Some verbatim_support strings span a line break in the extracted PDF text; line break preserved as \\n.", "Performing lab names for Riverbend components are paraphrased from report headers.", "Morphology footer reads 'Page 1 of 1' although the extracted text has two pages; content from both pages used."], "html": "<h1>Part A - Integrated Hematopathology Report<\/h1>\n<h2>1. Patient and specimen identification<\/h2>\n<ul>\n<li><strong>Patient:<\/strong> DOE, JONATHAN R.<\/li>\n<li><strong>MRN:<\/strong> MRN-4471902<\/li>\n<li><strong>DOB / Age / Sex:<\/strong> 1967-09-14 / 58 / Male<\/li>\n<li><strong>Ordering provider:<\/strong> Patel, Anjali R., MD (Hematology/Oncology)<\/li>\n<li><strong>Case ID:<\/strong> AML-WORKSHOP-CASE-01 (see Limitations)<\/li>\n<li><strong>Specimen:<\/strong> Bone marrow, left posterior iliac crest<\/li>\n<li><strong>Collection date:<\/strong> 2026-04-22<\/li>\n<li><strong>Material received:<\/strong> aspirate smears (Wright-Giemsa); clot section; decalcified core biopsy (H&amp;E); aspirate for flow cytometry; aspirate for cytogenetics/FISH; EDTA aspirate for molecular NGS<\/li>\n<li><strong>Identity check:<\/strong> All four component reports carry the same name, MRN, DOB and collection date. The molecular report cross-references accession S26-BM-01187, and the cytogenetics report references MMD-26-NGS-22150.<\/li>\n<\/ul>\n<h2>2. Component studies reviewed<\/h2>\n<table>\n<thead>\n<tr>\n<th>Source<\/th>\n<th>Study<\/th>\n<th>Accession<\/th>\n<th>Performing laboratory<\/th>\n<th>Report date<\/th>\n<th>Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>MORPH<\/td>\n<td>Bone marrow morphology<\/td>\n<td>S26-BM-01187<\/td>\n<td>Riverbend Regional Medical Center, Department of Pathology &amp; Laboratory Medicine (Hematopathology)<\/td>\n<td>2026-04-24<\/td>\n<td>Final (morphology component)<\/td>\n<\/tr>\n<tr>\n<td>FLOW<\/td>\n<td>Flow cytometry<\/td>\n<td>FC-26-003942<\/td>\n<td>Riverbend Regional Medical Center, Flow Cytometry Laboratory<\/td>\n<td>2026-04-23<\/td>\n<td>Final<\/td>\n<\/tr>\n<tr>\n<td>CYTO<\/td>\n<td>Cytogenetics and FISH<\/td>\n<td>CG-26-00871<\/td>\n<td>Riverbend Regional Medical Center, Cytogenetics Laboratory<\/td>\n<td>2026-04-29<\/td>\n<td>Final<\/td>\n<\/tr>\n<tr>\n<td>MOLEC<\/td>\n<td>Myeloid NGS panel<\/td>\n<td>MMD-26-NGS-22150<\/td>\n<td>Meridian Molecular Diagnostics (reference laboratory, CLIA 14D8888888)<\/td>\n<td>2026-05-04<\/td>\n<td>Final<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>3. Clinical context<\/h2>\n<p>A 58-year-old man presented with three weeks of progressive fatigue, exertional dyspnea, gingival bleeding and scattered lower-extremity ecchymoses. CBC: WBC 38.4 x10^9/L, hemoglobin 7.9 g/dL, platelets 31 x10^9/L. The peripheral smear showed 41% circulating blasts, some with folded nuclei and abundant cytoplasm. He has no prior hematologic history and no prior chemotherapy or radiation. The marrow was performed to evaluate for acute leukemia.<\/p>\n<h2>4. Morphology summary<\/h2>\n<ul>\n<li><strong>Aspirate:<\/strong> Blasts 18% by 500-cell manual differential. Promonocytes (4%) were counted separately from blasts. No definite Auer rods after review of multiple smears.<\/li>\n<li><strong>Core biopsy:<\/strong> Markedly hypercellular (approximately 90-95%). Immature mononuclear cells replace the marrow in sheets, with interstitial and paratrabecular distribution and extensive blast-equivalent infiltration.<\/li>\n<li><strong>Cytochemistry:<\/strong> MPO positive in a minor subset of blasts (approximately 5-10%). NSE (alpha-naphthyl butyrate) positive in a subset of cells with partial fluoride inhibition, which supports a monocytic component. Reticulin MF-1, without significant fibrosis. Storage iron present; no ring sideroblasts.<\/li>\n<li><strong>Background hematopoiesis:<\/strong> Erythropoiesis is left-shifted with mild megaloblastoid change. Megakaryocytes are reduced, and markedly reduced on the core.<\/li>\n<li><strong>Lineage:<\/strong> Myeloid, with probable monocytic differentiation by morphology and cytochemistry. The report defers confirmation to flow cytometry and notes that promonocytes are hard to separate from immature myeloid forms on smears.<\/li>\n<li><strong>Morphologic diagnosis:<\/strong> Hypercellular marrow with acute myeloid leukemia (with comment).<\/li>\n<li><strong>Comment carried forward:<\/strong> The report states that under current WHO and ICC classifications a 20% blast count is not required for AML when a defining genetic abnormality is present.<\/li>\n<\/ul>\n<h2>5. Flow cytometry summary<\/h2>\n<ul>\n<li><strong>Blasts:<\/strong> Abnormal myeloid blast population, approximately 22% of total nucleated cells by CD45/side scatter gating.<\/li>\n<li><strong>Blast phenotype:<\/strong> CD34 positive (subset, about 60%), CD117+, HLA-DR bright, CD13+, CD33 bright, CD38+, cytoplasmic MPO dim subset, CD64+, CD4 dim, CD11b partial/variable, CD14 negative. Aberrant CD56 (partial) and CD7 (subset). CD2, CD19 and cytoplasmic CD3 negative.<\/li>\n<li><strong>Monocytic compartment:<\/strong> Markedly expanded and left-shifted, approximately 30% of TNC (maturing monocytes 19%, promonocytes/immature monocytic cells 11%). These cells express bright uniform CD64, CD14 on the maturing fraction, CD11b, CD11c, CD36, HLA-DR, dim CD4, CD13 and CD33. They are CD34 negative, with partial CD56.<\/li>\n<li><strong>Lymphocytes:<\/strong> Polytypic, no aberrancy.<\/li>\n<li><strong>Conclusion:<\/strong> Diagnostic of acute myeloid leukemia with monocytic differentiation. The immunophenotype establishes the monocytic lineage that morphology only favored.<\/li>\n<\/ul>\n<h2>6. Cytogenetics summary<\/h2>\n<ul>\n<li><strong>Karyotype:<\/strong> 46,XY[20]. Twenty metaphases analyzed and five fully karyotyped at 400-425 bphs. No clonal numerical or structural abnormality.<\/li>\n<li><strong>AML FISH panel (all negative):<\/strong> RUNX1-RUNX1T1 t(8;21) 0.5%; CBFB inv(16)/t(16;16) 1.0%; PML-RARA t(15;17) 0.5%; KMT2A 11q23.3 rearrangement 1.5%; MECOM 3q26.2 rearrangement 1.0%; EGR1 -5/5q- 1.5%; D7S486 -7/7q- 1.0%; TP53 17p deletion 2.0%.<\/li>\n<li><strong>Interpretation:<\/strong> Cytogenetically normal category. The report gives no explicit risk tier. It notes that cytogenetically normal AML is often driven by gene-level mutations and that molecular testing is required for classification and risk stratification.<\/li>\n<\/ul>\n<h2>7. Molecular summary<\/h2>\n<p>Assay: 54-gene myeloid hybrid-capture NGS panel on bone marrow genomic DNA. Mean target coverage 1,150x, minimum 250x. FLT3-ITD detection is supplemented by capillary fragment analysis.<\/p>\n<table>\n<thead>\n<tr>\n<th>Gene<\/th>\n<th>Variant<\/th>\n<th>Consequence<\/th>\n<th>VAF<\/th>\n<th>Tier<\/th>\n<th>Classifying<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>NPM1<\/td>\n<td>NM_002520.7:c.860_863dup p.(Trp288CysfsTer12)<\/td>\n<td>Frameshift insertion, type A (4-bp TCTG duplication)<\/td>\n<td>39%<\/td>\n<td>I<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>FLT3<\/td>\n<td>Internal tandem duplication, exon 14 (~36 bp)<\/td>\n<td>In-frame ITD; ITD/WT allelic ratio 0.62<\/td>\n<td>31%<\/td>\n<td>I<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td>DNMT3A<\/td>\n<td>NM_022552.5:c.2645G&gt;A p.(Arg882His)<\/td>\n<td>Missense, R882 hotspot<\/td>\n<td>44%<\/td>\n<td>II<\/td>\n<td>No<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>No reportable variant:<\/strong> CEBPA, RUNX1, TP53, ASXL1, IDH1, IDH2, NRAS, KRAS, KIT, TET2, SRSF2, U2AF1, SF3B1, EZH2, BCOR, STAG2, PTPN11, WT1, PHF6, ZRSR2, JAK2, CALR, MPL, SETBP1, CSF3R, NF1, RAD21, GATA2, ETV6, CBL.<\/li>\n<li><strong>Laboratory interpretation:<\/strong> Mutated NPM1 is stated to be a WHO and ICC disease-defining genetic abnormality, and a 20% blast threshold is not required for this entity. FLT3-ITD is stated to be prognostically adverse and targetable. DNMT3A R882H is commonly co-mutated with NPM1 and FLT3-ITD and is often a clonal hematopoiesis founder event. The report states it does not by itself define or change the disease category and lists it for completeness and possible prognostic relevance.<\/li>\n<\/ul>\n<h2>8. Integrated interpretation<\/h2>\n<ol>\n<li>Morphology and flow cytometry independently identify acute myeloid leukemia.<\/li>\n<li>Morphology considered monocytic differentiation probable on the basis of monocytoid cells and NSE positivity with partial fluoride inhibition, and it left the lineage call to flow cytometry.<\/li>\n<li>Flow cytometry confirms monocytic differentiation: an expanded, left-shifted monocytic compartment of about 30% of nucleated cells expresses bright CD64, CD11b, CD11c, CD36 and dim CD4, with CD14 on the maturing fraction.<\/li>\n<li>This difference in lineage certainty is not a true conflict, because immunophenotyping is the more specific method and the morphology report asked for flow confirmation.<\/li>\n<li>Both methods agree that MPO marks only a minor subset of blasts.<\/li>\n<li>The marrow blast percentage does conflict: 18% by 500-cell manual aspirate differential and 22% by flow gating.<\/li>\n<li>The flow report states that manual and gated counts are expected to differ, and the morphology report attributes its lower figure to hemodilution and to the difficulty of separating promonocytes from myeloid blasts on smears.<\/li>\n<li>The core biopsy, 90-95% cellular with sheets of immature mononuclear cells, shows infiltration well above either number.<\/li>\n<li>Both values are reported as measured, and neither is forced into a single figure.<\/li>\n<li>The two counts straddle the historical 20% threshold, and the manual count falls below it.<\/li>\n<li>That tension does not decide the case.<\/li>\n<li>NGS detected an NPM1 type A frameshift insertion at a VAF of 39%.<\/li>\n<li>Both the morphology and molecular reports state that under WHO and ICC a 20% blast count is not required when a defining genetic abnormality such as mutated NPM1 is present.<\/li>\n<li>The NPM1 mutation was detectable only by NGS and was invisible to morphology, flow cytometry and cytogenetics, so the defining abnormality in this case came from a single modality.<\/li>\n<li>Cytogenetics supplied the necessary exclusions: the karyotype is 46,XY[20], and FISH is negative for PML-RARA, RUNX1-RUNX1T1, CBFB, KMT2A and MECOM rearrangements and for 5q, 7q and 17p loss.<\/li>\n<li>Only cytogenetics could exclude these lesions, since the NGS assay does not reliably detect large structural rearrangements or copy-number changes.<\/li>\n<li>No competing cytogenetically defined AML entity or adverse cytogenetic lesion is present, which fits the cytogenetics report's statement that cytogenetically normal AML is often driven by gene-level mutations.<\/li>\n<li>FLT3-ITD (VAF 31%, allelic ratio 0.62) was also seen only by NGS.<\/li>\n<li>It does not change the disease category, but it is prognostically adverse and is a target for FLT3 inhibitor therapy.<\/li>\n<li>DNMT3A R882H (VAF 44%) was detected only by NGS as well.<\/li>\n<li>The molecular report states that it does not by itself define or change the disease category, and it plays no part in this classification.<\/li>\n<li>Partial CD56 and subset CD7 expression on blasts was seen only by flow cytometry.<\/li>\n<li>These aberrancies do not alter the diagnosis, but they give a leukemia-associated immunophenotype that may be useful for measurable residual disease tracking.<\/li>\n<\/ol>\n<h2>9. Final integrated diagnosis<\/h2>\n<ol>\n<li>Bone marrow, left posterior iliac crest: acute myeloid leukemia with mutated NPM1 (WHO and ICC), with monocytic differentiation established by flow cytometry.<\/li>\n<li>FLT3 internal tandem duplication is present (VAF 31%, ITD/WT allelic ratio 0.62) as a prognostically adverse co-mutation.<\/li>\n<li>Marrow blasts are 18% by manual aspirate differential and 22% by flow cytometry; a 20% blast count is not required for this entity.<\/li>\n<li>The karyotype is normal male, 46,XY[20], and the AML FISH panel is negative.<\/li>\n<\/ol>\n<h2>10. Prognostic and predictive notes<\/h2>\n<ul>\n<li><strong>FLT3-ITD:<\/strong> The molecular report states it is prognostically adverse and a target for FLT3 inhibitor therapy. The ITD/WT allelic ratio of 0.62 is reported to support treatment decisions.<\/li>\n<li><strong>DNMT3A R882H (VAF 44%):<\/strong> Non-classifying. It is commonly co-mutated with NPM1 and FLT3-ITD and is often a clonal hematopoiesis founder event. The molecular report lists it for possible prognostic relevance only.<\/li>\n<li><strong>Negative findings with risk relevance:<\/strong> No TP53 variant by NGS and no 17p deletion by FISH. No -5/5q-, -7/7q-, KMT2A or MECOM abnormality by FISH. No RUNX1, ASXL1 or KIT variant by NGS.<\/li>\n<li><strong>Risk tier:<\/strong> None of the component reports assigns an explicit cytogenetic or integrated risk tier. This report does not assign one.<\/li>\n<li><strong>Residual disease monitoring:<\/strong> The flow report notes that aberrant CD56/CD7 expression may be useful for measurable residual disease tracking.<\/li>\n<\/ul>\n<h2>11. Limitations and pending or recommended studies<\/h2>\n<p><strong>Limitations stated by the component reports<\/strong>\n- Morphology: the manual aspirate blast count (18%) is likely lowered by hemodilution and by difficulty separating promonocytes from myeloid blasts. The morphology component was not intended to stand alone.\n- Flow cytometry: the blast estimate (22%) differs from the manual count, as expected for gated versus manual methods. Laboratory-developed test.\n- Cytogenetics: a normal karyotype does not exclude a submicroscopic abnormality.\n- Molecular: analytical sensitivity is about 5% VAF for SNVs and small indels. The assay does not reliably detect large structural rearrangements, copy-number changes, or variants in low-coverage or high-homology regions. A negative result does not exclude a mutation below the limit of detection. Laboratory-developed test, not FDA cleared or approved.<\/p>\n<p><strong>Uncertainties flagged during data extraction<\/strong>\n- Monocyte counts differ between modalities and were not reconciled. Morphology reports 6% mature monocytes and 4% promonocytes, while flow reports 19% maturing monocytes and 11% promonocytes. The integrated diagnosis does not depend on either set, but the discrepancy is recorded.\n- Report dates are recorded as printed. The morphology report (2026-04-24) states ancillary results were pending even though flow was issued 2026-04-23.\n- The FLT3-ITD has no HGVS designation in the source report; a descriptive designation is used.\n- Some NPM1 and FLT3 table rows were split during PDF text extraction and reassembled by column position. The HGVS, consequence and VAF values should be checked against the original molecular report before sign-out.\n- The case ID was not stated in any source report and was taken from the schema example. Riverbend laboratory names are paraphrased from report headers. The morphology footer reads \"Page 1 of 1\" although two pages of content were extracted and used.\n- The flow monocytic percentage (about 30%) is the sum of the reported 19% and 11% fractions.<\/p>\n<p><strong>Pending or recommended studies<\/strong>\n- All four component studies are final. No studies are pending.\n- The aberrant CD56/CD7 immunophenotype is available as a baseline for measurable residual disease tracking by flow cytometry.<\/p>\n<hr />\n<h2>Part B - Evidence trace<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Sentence<\/th>\n<th>Source(s)<\/th>\n<th>Basis<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>8.1<\/td>\n<td>Morphology and flow cytometry independently identify acute myeloid leukemia.<\/td>\n<td>MORPH, FLOW<\/td>\n<td>concordance<\/td>\n<\/tr>\n<tr>\n<td>8.2<\/td>\n<td>Morphology considered monocytic differentiation probable on the basis of monocytoid cells and NSE positivity with partial fluoride inhibition, and it left the lineage call to flow cytometry.<\/td>\n<td>MORPH<\/td>\n<td>direct_finding<\/td>\n<\/tr>\n<tr>\n<td>8.3<\/td>\n<td>Flow cytometry confirms monocytic differentiation: an expanded, left-shifted monocytic compartment of about 30% of nucleated cells expresses bright CD64, CD11b, CD11c, CD36 and dim CD4, with CD14 on the maturing fraction.<\/td>\n<td>FLOW<\/td>\n<td>direct_finding<\/td>\n<\/tr>\n<tr>\n<td>8.4<\/td>\n<td>This difference in lineage certainty is not a true conflict, because immunophenotyping is the more specific method and the morphology report asked for flow confirmation.<\/td>\n<td>MORPH, FLOW<\/td>\n<td>discordance_resolution<\/td>\n<\/tr>\n<tr>\n<td>8.5<\/td>\n<td>Both methods agree that MPO marks only a minor subset of blasts.<\/td>\n<td>MORPH, FLOW<\/td>\n<td>concordance<\/td>\n<\/tr>\n<tr>\n<td>8.6<\/td>\n<td>The marrow blast percentage does conflict: 18% by 500-cell manual aspirate differential and 22% by flow gating.<\/td>\n<td>MORPH, FLOW<\/td>\n<td>discordance_resolution<\/td>\n<\/tr>\n<tr>\n<td>8.7<\/td>\n<td>The flow report states that manual and gated counts are expected to differ, and the morphology report attributes its lower figure to hemodilution and to the difficulty of separating promonocytes from myeloid blasts on smears.<\/td>\n<td>FLOW, MORPH<\/td>\n<td>discordance_resolution<\/td>\n<\/tr>\n<tr>\n<td>8.8<\/td>\n<td>The core biopsy, 90-95% cellular with sheets of immature mononuclear cells, shows infiltration well above either number.<\/td>\n<td>MORPH<\/td>\n<td>discordance_resolution<\/td>\n<\/tr>\n<tr>\n<td>8.9<\/td>\n<td>Both values are reported as measured, and neither is forced into a single figure.<\/td>\n<td>MORPH, FLOW<\/td>\n<td>discordance_resolution<\/td>\n<\/tr>\n<tr>\n<td>8.10<\/td>\n<td>The two counts straddle the historical 20% threshold, and the manual count falls below it.<\/td>\n<td>MORPH, FLOW<\/td>\n<td>discordance_resolution<\/td>\n<\/tr>\n<tr>\n<td>8.11<\/td>\n<td>That tension does not decide the case.<\/td>\n<td>MORPH, MOLEC<\/td>\n<td>discordance_resolution<\/td>\n<\/tr>\n<tr>\n<td>8.12<\/td>\n<td>NGS detected an NPM1 type A frameshift insertion at a VAF of 39%.<\/td>\n<td>MOLEC<\/td>\n<td>direct_finding<\/td>\n<\/tr>\n<tr>\n<td>8.13<\/td>\n<td>Both the morphology and molecular reports state that under WHO and ICC a 20% blast count is not required when a defining genetic abnormality such as mutated NPM1 is present.<\/td>\n<td>MORPH, MOLEC<\/td>\n<td>classification_rule<\/td>\n<\/tr>\n<tr>\n<td>8.14<\/td>\n<td>The NPM1 mutation was detectable only by NGS and was invisible to morphology, flow cytometry and cytogenetics, so the defining abnormality in this case came from a single modality.<\/td>\n<td>MOLEC<\/td>\n<td>single_source_finding<\/td>\n<\/tr>\n<tr>\n<td>8.15<\/td>\n<td>Cytogenetics supplied the necessary exclusions: the karyotype is 46,XY[20], and FISH is negative for PML-RARA, RUNX1-RUNX1T1, CBFB, KMT2A and MECOM rearrangements and for 5q, 7q and 17p loss.<\/td>\n<td>CYTO<\/td>\n<td>single_source_finding<\/td>\n<\/tr>\n<tr>\n<td>8.16<\/td>\n<td>Only cytogenetics could exclude these lesions, since the NGS assay does not reliably detect large structural rearrangements or copy-number changes.<\/td>\n<td>CYTO, MOLEC<\/td>\n<td>single_source_finding<\/td>\n<\/tr>\n<tr>\n<td>8.17<\/td>\n<td>No competing cytogenetically defined AML entity or adverse cytogenetic lesion is present, which fits the cytogenetics report's statement that cytogenetically normal AML is often driven by gene-level mutations.<\/td>\n<td>CYTO, MOLEC<\/td>\n<td>concordance<\/td>\n<\/tr>\n<tr>\n<td>8.18<\/td>\n<td>FLT3-ITD (VAF 31%, allelic ratio 0.62) was also seen only by NGS.<\/td>\n<td>MOLEC<\/td>\n<td>single_source_finding<\/td>\n<\/tr>\n<tr>\n<td>8.19<\/td>\n<td>It does not change the disease category, but it is prognostically adverse and is a target for FLT3 inhibitor therapy.<\/td>\n<td>MOLEC<\/td>\n<td>single_source_finding<\/td>\n<\/tr>\n<tr>\n<td>8.20<\/td>\n<td>DNMT3A R882H (VAF 44%) was detected only by NGS as well.<\/td>\n<td>MOLEC<\/td>\n<td>single_source_finding<\/td>\n<\/tr>\n<tr>\n<td>8.21<\/td>\n<td>The molecular report states that it does not by itself define or change the disease category, and it plays no part in this classification.<\/td>\n<td>MOLEC<\/td>\n<td>single_source_finding<\/td>\n<\/tr>\n<tr>\n<td>8.22<\/td>\n<td>Partial CD56 and subset CD <script>
const D = JSON.parse(document.getElementById('data').textContent);
const STEPS = [
  {id:'inputs', label:'1 · Four reports'},
  {id:'chatbot', label:'2 · Chatbot'},
  {id:'agent', label:'3 · Agent pipeline'},
  {id:'report', label:'4 · Agent report'},
  {id:'manual', label:'5 · Two prompts, no code'},
  {id:'scorecard', label:'6 · Side by side'}];
const SRC = {MORPH:'Morphology', FLOW:'Flow cytometry', CYTO:'Cytogenetics + FISH', MOLEC:'Molecular NGS'};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chip = id => `<span class="chip ${esc(id)}">${esc(id)}</span>`;
const nav = document.querySelector('nav.steps'), main = document.getElementById('main');
nav.innerHTML = STEPS.map(s => `<a href="#${s.id}">${s.label}</a>`).join('');
let chatRun = 1, node = 'extract-MOLEC';

function views(){ return {
inputs(){
  const meta = {
    MORPH:['Riverbend Regional · S26-BM-01187','Blasts 18% (manual count). Monocytic lineage only “probable”.'],
    FLOW:['Riverbend Regional · FC-26-003942','Blasts 22% (gated). Proves monocytic lineage.'],
    CYTO:['Riverbend Regional · CG-26-00871','Normal karyotype 46,XY[20]. AML FISH panel negative.'],
    MOLEC:['Meridian Molecular · MMD-26-NGS-22150','The only report with NPM1, FLT3-ITD and DNMT3A.']};
  return `<div class="head"><p class="eyebrow">The input</p><h1>One patient, four reports, four labs’ formats</h1>
  <p class="lede">A synthetic 58-year-old man with a new bone marrow workup. No single report is enough to name the disease. Both the chatbot and the agent receive exactly these four documents.</p></div>
  <div class="grid4">${Object.keys(SRC).map(id => `<article class="card">
    <div>${chip(id)}</div><h3>${SRC[id]}</h3><p class="meta">${meta[id][0]}</p>
    <p class="only"><b>What it adds:</b> ${meta[id][1]}</p>
    <details class="raw"><summary>Show report text</summary><pre class="rawtext">${esc(D.raw[id].trim())}</pre></details></article>`).join('')}</div>
  <p class="note"><b>Built-in traps:</b> the blast counts disagree (18% vs 22%); morphology hedges on lineage and flow resolves it; the defining mutation (NPM1) appears in only one report; and DNMT3A is a real but non-classifying variant that belongs in prognostic notes, not the diagnosis line.</p>`;
},
chatbot(){
  const r = D.chat[chatRun-1];
  return `<div class="head"><p class="eyebrow">Version 1 · one prompt, one pass</p><h1>The chatbot</h1>
  <p class="lede">The four reports attached to a general assistant with a generic system prompt. Run three times in fresh chats.</p></div>

      <button data-jump="dx-${chatRun}">Jump to final diagnosis</button></div>
    <article class="doc" id="chatdoc">${r.html}</article></div>
  <aside class="side">
    <h3>What to point at</h3>
    <ul class="obs">
      <li><b>It reads well and the core diagnosis is right.</b>All three runs name AML with mutated NPM1.</li>
      <li><b>DNMT3A lands in the diagnosis block.</b>All three runs list it under Final Diagnosis (highlighted). It is prognostic, not classifying.</li>
      <li><b>No sentence says which report it came from.</b>To check it, a pathologist has to reread all four reports.</li>
      <li><b>Some reasoning comes from outside the reports.</b>${chatRun===3 ? 'This run adds “cup-like” nuclear forms, which no report mentions.' : chatRun===2 ? 'This run adds that promonocytes count as blast equivalents, which no report states.' : 'This run infers clonal order from allele frequencies; only part of that is in the molecular report.'}</li>

  </aside></div>`;
},
agent(){

  return `<div class="head"><p class="eyebrow">Version 2 · same model, broken into checkable steps</p><h1>The agent pipeline</h1>

    <div class="stage"><span class="lab">2 · Compare reports</span>${n('cross','','llm','Cross-report analysis',`${D.cross.discordances.length} discordances · ${D.cross.single_source_findings.length} single-source`)}</div>
    <div class="stage"><span class="lab">3 · Specialist summaries</span>${n('p-morph','','llm','Morphology parser')}${n('p-flow','','llm','Flow parser')}${n('p-cyto','','llm','Cytogenetics parser')}${n('molsplit','','code','Molecular split','classifying vs prognostic')}</div>
    <div class="stage"><span class="lab">4 · Integrate</span>${n('who','','llm','WHO classifier','+ WHO 5e rules text')}</div>
    <div class="stage"><span class="lab">5 · Check</span>${n('qa-det','','code','Rule checks',`${D.qa_det.length} flags`)}${n('qa-llm','','llm','QA reviewer',`${D.qa_llm.length} flags`)}</div>
  </div>

},
report(){
  const ir = D.who.integrated_report, t = D.who.evidence_trace;
  const row = r => `<div class="trow"><span class="n">${r.section==='final_integrated_diagnosis'?'Dx ':''}${r.sentence_number}</span><p class="s">${esc(r.sentence)}</p><div class="src"><div class="vrow" style="gap:4px">${r.supporting_source_ids.map(chip).join('')}</div><span class="basis ${esc(r.basis)}">${esc(r.basis.replace(/_/g,' '))}</span></div></div>`;
  return `<div class="head"><p class="eyebrow">Version 2 · output</p><h1>Integrated report with an evidence trace</h1>

    <div class="flags">${D.qa_llm.map(f=>`<div class="flag"><span class="sev ${esc(f.severity)}">${esc(f.severity)}</span><div><span class="cat">${esc(f.category.replace(/_/g,' '))}</span><p>${esc(f.concern)}</p></div></div>`).join('')}</div>
    <p class="note">The reviewer caught the agent’s own overreach, including its claim that 18% + 4% promonocytes “matches” flow. The mistake is visible and flagged instead of buried in fluent prose.</p>
  </aside></div>`;
},
manual(){
  const M = D.manual, cr = M.cross;
  return `<div class="head"><p class="eyebrow">The same idea without software</p><h1>Two prompts in any chat tool</h1>
  <p class="lede">The pathologist-designed version of this case (O. Baba). Prompt 1 plus the four reports gives structured data. Prompt 2 plus that data gives the report and its evidence trace. Anyone can run it by copy and paste; no code, no platform.</p></div>
  <div class="grid4" style="grid-template-columns:repeat(2,minmax(0,1fr))">
    <article class="card"><p class="eyebrow">Step 1 · Extractor prompt</p><h3>Organize, don’t interpret</h3>
      <p class="meta">Every finding tagged with its report and a quote: ${M.verified} of ${M.total_quotes} quotes found in the source text.</p>
      <div class="tablewrap"><table class="heads">${M.sources.map(s=>`<tr><td>${chip(s.source_id)}</td><td>${esc(s.accession)} · ${esc(s.performing_lab)} · ${esc(s.report_date)}</td></tr>`).join('')}</table></div>
      <p class="meta"><b>Discordances found:</b> ${cr.discordances.map(d=>esc(d.topic)).join('; ')}</p>
      <div class="vrow">${M.variants.map(v=>`<div class="vcard ${v.classifying?'cls':'prg'}"><b>${esc(v.gene)}</b><br><span class="${v.classifying?'ok':'meta'}">${v.classifying?'Classifying':'Not classifying'}</span></div>`).join('')}</div>
      <details class="raw"><summary>It also listed ${M.uncertain.length} things it was unsure about</summary><ul class="meta">${M.uncertain.map(u=>`<li>${esc(u)}</li>`).join('')}</ul></details>
    </article>
    <article class="card"><p class="eyebrow">Step 2 · Integrator prompt</p><h3>Diagnosis vs the pathologist’s answer key</h3>
      <div class="dx" style="padding:16px 18px"><p class="eyebrow">Model output</p>${(M.html.match(/<h2>9\.[\s\S]*?(?=<h2>)/)||[''])[0].replace(/<h2>[^<]*<\/h2>/,'').replace(/<[^>]+>/g,' ').split(/\s(?=\d\.\s)/).filter(s=>s.trim()).map(s=>`<p style="font-size:17px;font-weight:400">${esc(s.trim())}</p>`).join('')}</div>
      <div class="card" style="background:var(--soft)"><p class="eyebrow">Gold standard (pathologist-authored)</p>${D.gold_dx.map(s=>`<p>${esc(s)}</p>`).join('')}</div>
      <p class="meta">${M.checks.traced} sentences traced, ${M.checks.unsupported} unsupported. DNMT3A kept to the prognostic notes.</p>
    </article>
  </div>
  <details class="raw"><summary>Show the full report from step 2</summary><article class="doc" style="margin-top:10px">${M.html}</article></details>
  <p class="note"><b>Why this matters for your site:</b> this is step 2 of the ladder. Splitting one big question into “extract with quotes” then “integrate with a trace” works in any chatbot today, with synthetic or de-identified material. Running it on real patient data needs a sanctioned deployment and validation.</p>`;
},
scorecard(){
  const c = D.chat.map(x=>x.checks), a = D.agent_checks, m = D.manual.checks;
  const cell = v => v===true ? '<td class="c pass">Pass</td>' : v===false ? '<td class="c fail">Fail</td>' : v==='Close' ? '<td class="c" style="color:var(--warn)">Close</td>' : `<td class="c na">${v}</td>`;
  const gold = x => x.npm1_in_dx && x.dnmt3a_out_of_dx && x.flt3_in_dx;
  const rows = [
    ['Diagnosis names NPM1 (the defining mutation)', c.map(x=>x.npm1_in_dx), a.npm1_in_dx, m.npm1_in_dx],
    ['DNMT3A kept out of the diagnosis (lane discipline)', c.map(x=>x.dnmt3a_out_of_dx), a.dnmt3a_out_of_dx, m.dnmt3a_out_of_dx],
    ['Diagnosis lines match the gold standard', c.map(gold), gold(a) ? true : 'Close', gold(m)],
    ['Both blast counts (18% and 22%) named and reconciled', c.map(x=>x.blast_reconciled), a.blast_reconciled, m.blast_reconciled],
    ['Each sentence linked to its source report', ['None','None','None'], `${a.traced} of ${a.traced}`, `${m.traced} of ${m.traced}`],
    ['Extracted findings quoted from the source', ['None','None','None'], `${D.verified} of ${D.total_quotes} found`, `${D.manual.verified} of ${D.manual.total_quotes} found`],
    ['Independent review before sign-out', ['None','None','None'], `${D.qa_det.length + D.qa_llm.length} flags raised`, 'Answer key'],
    ['Lab names and accession numbers carried into the report', [true,true,true], false, true]];
  return `<div class="head"><p class="eyebrow">The comparison</p><h1>Same reports, same model family, different structure</h1>
  <p class="lede">Scored against the workshop’s own pass criteria for this case. The chatbot is usually close. The difference is whether you can check it.</p></div>
  <div class="tablewrap"><table class="score"><thead><tr><th>Check</th><th>Chat run 1</th><th>Chat run 2</th><th>Chat run 3</th><th>Agent pipeline</th><th>Two prompts</th></tr></thead>
  <tbody>${rows.map(r=>`<tr><th scope="row" style="font-weight:600">${r[0]}</th>${r[1].map(cell).join('')}${cell(r[2])}${cell(r[3])}</tr>`).join('')}</tbody></table></div>
  <p class="note"><b>Neither structured version is perfect.</b> The agent pipeline dropped lab names and accession numbers because its extraction step was never asked to keep them, and it left FLT3-ITD out of the diagnosis lines because its rules send FLT3-ITD to the prognostic notes. The gold standard lists FLT3-ITD as present. These are prompt choices a pathologist can see and edit. The chatbot’s choices are invisible.</p>`;
}};}

function detail(id){
  if(id.startsWith('extract-')){
    const s = id.slice(8), e = D.extract[s];
    const vs = (e.molecular_variants||[]).length ? `<h3>Variants (with the classifying flag the prompt asks for)</h3><div class="vrow">${e.molecular_variants.map(v=>`<div class="vcard ${v.classifying?'cls':'prg'}"><b>${esc(v.gene)}</b> · VAF ${esc(v.vaf)} · Tier ${esc(v.tier)}<br><span class="${v.classifying?'ok':'meta'}">${v.classifying?'Classifying':'Not classifying'}</span><p class="meta">${esc(v.prognostic_note||'')}</p></div>`).join('')}</div>` : '';
    return `<div class="vrow" style="align-items:center">${chip(s)}<h2>Extract: ${SRC[s]}</h2></div>
    <p>${esc(e.summary)}</p>${vs}
    <h3>Findings, each with a quote the code checks against the report</h3>
    ${e.key_findings.map(k=>`<div class="find"><span>${esc(k.text)}</span><q>${esc(k.verbatim_support)}</q><span class="${k._verified?'ok':'no'}">${k._verified?'Quote found':'Not found'}</span></div>`).join('')}`;
  }
  if(id==='cross'){
    const cr = D.cross;
    return `<h2>Cross-report analysis</h2><p class="meta">Reads only the four extractions. Names where reports disagree, how each disagreement resolves, and what only one report could see.</p>
    <h3>Discordances</h3>${cr.discordances.map(d=>`<div class="disc"><b>${esc(d.topic)}</b>${d.positions.map(p=>`<div class="pos">${chip(p.source_id)}<span>${esc(p.position)}</span></div>`).join('')}<p class="res"><b>${d.changes_diagnosis?'Changes the diagnosis.':'Does not change the diagnosis.'}</b> ${esc(d.resolution)}</p></div>`).join('')}
    <h3>Findings only one report could see</h3>${cr.single_source_findings.map(f=>`<div class="pos">${chip(f.only_source_id)}<span><b>${esc(f.finding)}</b> ${esc(f.diagnostic_impact)}</span></div>`).join('')}`;
  }
  if(id.startsWith('p-')){
    const k = id.slice(2), s = {morph:'MORPH',flow:'FLOW',cyto:'CYTO'}[k];
    return `<div class="vrow" style="align-items:center">${chip(s)}<h2>${SRC[s]} parser</h2></div><p class="meta">Turns one extraction into a summary paragraph for the integrator. It is told not to call the diagnosis.</p><p>${esc(D.parsers[k])}</p>`;
  }
  if(id==='molsplit'){
    const m = D.molsplit;
    return `<h2>Molecular split</h2><p class="meta">Plain code, no AI. Sorts variants by the classifying flag so the integrator receives them in separate lists.</p>
    <div class="vrow">${m.classifying_variants.map(v=>`<div class="vcard cls"><span class="ok">Classifying list</span><br><b>${esc(v.gene)}</b> ${esc(v.variant)}</div>`).join('')}${m.prognostic_variants.map(v=>`<div class="vcard prg"><span class="meta">Prognostic list</span><br><b>${esc(v.gene)}</b> ${esc(v.variant)}</div>`).join('')}</div>
    <p class="note">This is where lane discipline is enforced: DNMT3A arrives in a list the integrator is told never to use for the diagnosis.</p>`;
  }
  if(id==='who'){
    return `<h2>WHO classifier</h2><p class="meta">Receives the three parser summaries, the molecular lists, the cross-report analysis and the WHO 5e rules text. Must resolve every discordance out loud and trace every sentence.</p>
    <div class="dx"><p class="eyebrow">Diagnosis it produced</p>${D.who.integrated_report.final_integrated_diagnosis.map(s=>`<p>${esc(s)}</p>`).join('')}</div>
    <p>See step 4 for the full evidence trace.</p>`;
  }
  if(id==='qa-det'){
    return `<h2>Rule checks</h2><p class="meta">Plain code, no AI: any unsupported sentence, any prognostic-only gene in the diagnosis line, required findings (blast counts, lineage, defining abnormality, TP53), and whether each discordance was addressed.</p>
    <p class="note">${D.qa_det.length===0 ? '<b>0 flags.</b> No unsupported sentences, DNMT3A and FLT3 absent from the diagnosis line, all required findings present, every discordance addressed.' : esc(JSON.stringify(D.qa_det))}</p>`;
  }
  if(id==='qa-llm'){
    return `<h2>QA reviewer</h2><p class="meta">A second AI call that critiques the report without rewriting it.</p>
    <div class="flags">${D.qa_llm.map(f=>`<div class="flag"><span class="sev ${esc(f.severity)}">${esc(f.severity)}</span><div><span class="cat">${esc(f.category.replace(/_/g,' '))}</span><p>${esc(f.concern)}</p></div></div>`).join('')}</div>`;
  }
  return '';
}

function render(){
  let id = (location.hash||'').slice(1); if(!STEPS.some(s=>s.id===id)) id = 'inputs';
  nav.querySelectorAll('a').forEach(a => a.setAttribute('aria-current', a.getAttribute('href')==='#'+id ? 'page':'false'));
  const i = STEPS.findIndex(s=>s.id===id);
  main.innerHTML = `<div class="view">${views()[id]()}
    <div class="navbtns"><button data-go="${i-1}" ${i===0?'disabled':''}>← Previous</button><span class="meta">Use <span class="kbd">←</span> <span class="kbd">→</span> to move between steps</span><button data-go="${i+1}" ${i===STEPS.length-1?'disabled':''}>Next →</button></div>
    <p class="foot">Synthetic teaching case, prompts, gold standard and pipeline from the API Summit 2026 agentic pathology workshop (H. Javadi, S. Chamala, O. Baba): github.com/hesamhakim/agentic-pathology-workshop. These runs used Claude with the workshop’s own prompts, not the workshop VM’s model, so wording differs from the live workshop. Not for clinical use.</p></div>`;
}
main.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.run){ chatRun = +b.dataset.run; render(); }
  else if(b.dataset.jump){ const t = document.getElementById(b.dataset.jump); if(t) document.getElementById('chatdoc').scrollTop = t.offsetTop - 12; }
  else if(b.dataset.node){ node = b.dataset.node; render(); }
  else if(b.dataset.go){ const s = STEPS[+b.dataset.go]; if(s){ location.hash = s.id; window.scrollTo(0,0);} }
});
addEventListener('keydown', e => {
  if(e.target.closest('input,textarea')) return;
  const i = STEPS.findIndex(s => '#'+s.id === location.hash); const cur = i<0?0:i;
  if(e.key==='ArrowRight' && cur<STEPS.length-1){ location.hash = STEPS[cur+1].id; }
  if(e.key==='ArrowLeft' && cur>0){ location.hash = STEPS[cur-1].id; }
});
addEventListener('hashchange', () => { render(); window.scrollTo(0,0); });
render();
</script>
